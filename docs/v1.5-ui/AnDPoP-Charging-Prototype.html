<!doctype html>
<html lang="en" data-mode="dark" data-palette="Glacier">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnDPoP · Glacier dashboard</title>
<style>
:root{color-scheme:dark;--page:#0e2931;--glass:#24434a;--edge:#789099;--ink:#effafd;--muted:#b9cdd1;--accent:#bce7ee;--green:#79edab;--charge:#48c96c;--low:#ffb5a9;--shadow:#051b22;--on:#0e2931;font-family:Roboto,system-ui,sans-serif}
:root[data-palette=Iris]{--page:#211c39;--glass:#38324f;--edge:#81779f;--ink:#f5f1ff;--muted:#ccc3dd;--accent:#e0d2ff;--shadow:#120d26;--on:#211c39}
:root[data-palette=Guava]{--page:#341e2a;--glass:#4e3341;--edge:#9c7787;--ink:#fff1f4;--muted:#dbc0cb;--accent:#ffd1dd;--shadow:#21101a;--on:#341e2a}
:root[data-mode=light]{color-scheme:light;--page:#def3f6;--glass:#f1fcfd;--edge:#87abb2;--ink:#122d34;--muted:#425d65;--accent:#245460;--green:#116941;--charge:#36b85c;--low:#9b3528;--shadow:#8caeb5;--on:#fff}
:root[data-mode=light][data-palette=Iris]{--page:#eee9ff;--glass:#f9f6ff;--edge:#aaa1cb;--ink:#241e35;--muted:#57516c;--accent:#584477;--shadow:#aba0cc}
:root[data-mode=light][data-palette=Guava]{--page:#ffe9e4;--glass:#fff5f1;--edge:#cbaeaa;--ink:#352326;--muted:#6a5055;--accent:#754452;--shadow:#c6a2a0}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{width:min(100%,480px);margin:auto;padding:14px clamp(10px,4vw,18px) 28px}
.demo{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid color-mix(in srgb,var(--edge) 33%,transparent);margin-bottom:12px;font-size:.75rem;color:var(--muted)}
.demo button{font-size:.75rem}
.top{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.brand{font-size:1.25rem;font-weight:820;letter-spacing:-.03em;margin-right:auto}
h1,h2,h3,p,figure{margin:0}
h1{font-size:clamp(1.5rem,6vw,1.85rem);letter-spacing:-.035em;line-height:1.12;overflow-wrap:anywhere}
h2{font-size:1.33rem;letter-spacing:-.025em;line-height:1.2}
h3{font-size:.95rem}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.875rem;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:40px;background:color-mix(in srgb,var(--glass) 82%,transparent);padding:5px 8px;font-size:.75rem;color:var(--ink)}
.badge::before{content:"";width:6px;height:6px;border-radius:100%;background:var(--muted)}
.page-section{margin-top:20px}
.page-section>h2{margin-bottom:8px;padding-inline:3px}
.glass{border:1px solid color-mix(in srgb,var(--edge) 62%,transparent);background:linear-gradient(155deg,color-mix(in srgb,var(--glass) 92%,var(--ink) 8%),color-mix(in srgb,var(--glass) 45%,var(--page)));box-shadow:inset 0 1px 0 color-mix(in srgb,white 20%,transparent);border-radius:23px}
.battery{padding:10px 12px}
.card-head,.footer{display:flex;justify-content:space-between;align-items:center}
.card-head h2{padding-left:2px}
.footer{border-top:1px solid color-mix(in srgb,var(--edge) 43%,transparent);justify-content:flex-end;margin-top:9px;padding-top:7px}
.icon-button,.pill,.ghost{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);background:none;border:0;border-radius:100px;padding:0 10px}
.icon-button{min-width:48px;padding:0}
.pill{font-weight:600;font-size:.875rem;padding-inline:12px}
button.glass{background:linear-gradient(155deg,color-mix(in srgb,var(--glass) 85%,var(--ink) 15%),var(--glass));border:1px solid color-mix(in srgb,var(--edge) 65%,transparent)}
button:active{filter:brightness(.89)}
.icon{width:21px;height:21px;flex:none;display:inline-block;vertical-align:middle}
.icon svg{width:100%;height:100%;display:block}
.batteries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:3px 0 0}
.batteries.max{grid-template-columns:1fr}
.reading{text-align:center;display:grid;align-content:start;justify-items:center;gap:4px;padding:4px 1px;position:relative}
.reading+.reading::before{content:"";position:absolute;left:0;top:22%;bottom:8%;border-left:1px solid color-mix(in srgb,var(--edge) 47%,transparent)}
.reading img{height:66px;width:100%;object-fit:contain;margin-bottom:3px}
.max img{height:82px;max-width:130px;border-radius:12px}
.level{display:flex;justify-content:center;align-items:center;gap:4px;font-size:clamp(1.03rem,5.1vw,1.4rem);font-weight:780;font-variant-numeric:tabular-nums;min-height:27px}
.level .icon{width:25px;height:19px;color:var(--green)}
.reading figcaption,.note{color:var(--muted);font-size:.82rem}
.reading .note{font-size:.70rem;min-height:1em}
.note.charging{color:var(--green)}
.level.low,.note.low{color:var(--low)}
.battery-status{font-size:.8rem;color:var(--muted);margin:7px 2px}
.modes{padding:8px}
.mode-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.mode{position:relative;min-width:0;min-height:71px;padding:9px 1px 5px;display:grid;justify-items:center;align-content:start;gap:7px;border-radius:15px;text-align:center;font-size:clamp(.66rem,3vw,.79rem);letter-spacing:-.014em;line-height:1.1}
.mode .mark .icon{width:14px;height:14px}
.mode .mark{position:absolute;right:4px;top:4px;color:var(--green);width:14px;height:14px}
.feedback{font-size:.82rem;color:var(--muted);margin:9px 4px 3px;line-height:1.4}
.rows{padding:3px 12px}
.row{border:0;background:none;text-align:left;width:100%;min-height:48px;display:flex;align-items:center;gap:10px;padding:8px 0}
.row + .row{border-top:1px solid color-mix(in srgb,var(--edge) 36%,transparent)}
.row>span:nth-child(2){flex:1}
.row small{display:block;margin-top:3px;font-size:.77rem;line-height:1.35;color:var(--muted)}
.row .trail{color:var(--muted);font-size:.79rem;text-align:right}
.switch{width:42px;height:25px;border-radius:30px;border:1px solid var(--edge);flex:none;background:var(--page);display:flex;align-items:center;padding:3px}
.switch::after{content:"";width:17px;height:17px;border-radius:50%;background:var(--muted)}
[aria-checked=true]>.switch{justify-content:flex-end;background:var(--accent);border-color:var(--accent)}
[aria-checked=true]>.switch::after{background:var(--on)}
dialog{color:var(--ink);width:min(calc(100% - 16px),460px);max-height:85svh;margin:auto auto 8px;border-radius:24px;padding:15px;background:var(--page)!important;box-shadow:0 12px 36px #0006}
dialog::backdrop{background:#040c15a0}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.dialog-content{display:grid;gap:9px}
.detail-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--edge) 40%,transparent);min-height:43px}
.detail-row:last-child{border:0}
.detail-row .text{margin-right:auto}
.detail-row small{display:block;color:var(--muted)}
.detail-row .icon{color:var(--green)}
.field{display:grid;gap:5px;font-size:.88rem;padding:4px 0}
.field select,.field input{min-height:44px;background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:7px 8px;width:100%}
.copy{font-size:.85rem;color:var(--muted);line-height:1.4}
.primary{background:var(--accent);color:var(--on);border:0}
@media(max-width:335px){.mode-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mode{min-height:61px;font-size:.82rem}.level .icon{width:19px}}

:root{--well:#12303a;--shell:#d5e3e4;font-family:Roboto,"Arial",sans-serif}
:root[data-palette=Glacier][data-mode=dark]{--page:#0f2932;--glass:#28434a;--edge:#91a4a9;--ink:#f2fafb;--muted:#bacbd0;--accent:#b9e0e9;--green:#7de4a9}
:root[data-mode=light]{--shell:#304347;--well:#fff}
.app{width:min(100%,420px);padding:20px 16px 38px}
.top{margin:0 0 22px;padding:0 2px;gap:7px}.top .brand{font-weight:850;letter-spacing:-.045em;font-size:24px;color:var(--muted)}.top .ghost{color:var(--accent);font-size:17px}
.top .icon-button{border-radius:50%}.top .icon{width:22px;height:22px}
h1{font-size:clamp(24px,6.8vw,30px);letter-spacing:-.035em;margin-inline:4px}.meta{font-size:16px;gap:10px;margin:9px 4px 0}.badge{font-size:15px;color:var(--muted);padding:5px 9px;background:color-mix(in srgb,var(--glass) 75%,transparent)}
h2{font-size:clamp(24px,6.8vw,29px);letter-spacing:-.034em;font-weight:750}
.page-section{margin-top:21px}.page-section>h2{margin-bottom:9px}
.glass{border-color:color-mix(in srgb,var(--edge) 32%,transparent);border-top-color:color-mix(in srgb,var(--edge) 70%,transparent);background:linear-gradient(169deg,color-mix(in srgb,var(--glass) 95%,white 5%),color-mix(in srgb,var(--glass) 44%,var(--page)) 94%);box-shadow:inset 0 1px 0 #ffffff0c}
.battery{padding:6px 14px 6px}.card-head .icon-button{margin-right:-9px}.card-head h2{font-size:27px}
.batteries{padding-top:6px}.reading{gap:0;padding:0 1px 2px}.reading img{height:72px;margin:0 0 2px}.reading+.reading::before{top:17%;bottom:12%;opacity:.65}
.level{min-height:28px;font-size:24px;line-height:1.1;font-weight:700}.reading figcaption{font-size:16px;line-height:22px;margin-top:3px}
.reading .note{margin:0;min-height:24px;font-size:12px;display:flex;align-items:center;justify-content:center}
.charge-glyph{display:inline-flex;width:44px;height:24px;align-items:center;justify-content:center}.charge-glyph svg{width:100%;height:100%;display:block}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.footer{margin-top:8px;padding-top:5px}.footer .pill{min-height:44px;font-size:16px;font-weight:500;color:var(--accent);gap:2px;padding-inline:14px 10px}.footer .icon{width:16px;height:16px}
.modes{padding:7px 7px 10px}.mode-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.16fr) minmax(0,1fr) minmax(0,.90fr);gap:4px}.mode-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.mode{min-height:74px;padding:12px 1px 6px;align-content:start;gap:7px;font-size:clamp(12px,3.25vw,14px);line-height:1.12}
.mode span:nth-child(2){align-self:center}.mode .icon{width:21px;height:21px}.mode .mark{top:5px;right:5px}
.mode[data-mode-choice=cancel]>span:nth-child(2){max-width:46px}
.feedback{font-size:14px;line-height:1.42;margin:9px 6px 1px}.sound-label{flex:1}
#sound .row{padding:13px 1px;gap:16px}#sound .row small{font-size:14px;line-height:1.42;margin-top:6px}
.row .switch{flex:0 0 48px;width:48px;height:29px}.switch::after{width:21px;height:21px}
.detail-row{gap:14px;min-height:56px}.detail-row strong{min-width:3ch;text-align:right}.dialog-head h2{flex:1;font-size:23px}.dialog-head .icon-button{flex:none}.dialog-content .row{min-height:50px}.dialog-content .row>span:nth-child(2){font-size:15px}.field{gap:7px}
@media(max-width:345px){.mode-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mode{font-size:14px;min-height:65px}.mode[data-mode-choice=cancel]>span:nth-child(2){max-width:none}}
@media(min-width:650px){.app{padding-top:25px}}

#sound .row>.switch{flex:0 0 48px}#sound .sound-label{min-width:0}
.reading:nth-child(3) img{height:52px;width:72px;margin:20px 0 2px}
.mark svg{stroke-width:3.1}.mode .mark,.mode .mark .icon{width:13px;height:13px}
.appearance-choices{display:flex;gap:4px;background:var(--glass);padding:4px;border-radius:16px}.appearance-choices button,.swatches button{min-height:44px;flex:1;border:0;border-radius:12px;color:var(--muted);background:transparent}
.appearance-choices button[aria-pressed=true]{background:var(--accent);color:var(--on);font-weight:650}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.swatches button{padding:8px 5px;display:flex;justify-content:center;align-items:center;gap:6px;color:var(--ink);border:1px solid color-mix(in srgb,var(--edge) 45%,transparent);font-size:14px}.swatches button[aria-pressed=true]{border:2px solid var(--accent);font-weight:700}
.swatches i{display:inline-block;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px #0002}.swatches [data-val=Glacier] i{background:#91cbd4}.swatches [data-val=Iris] i{background:#bbace5}.swatches [data-val=Guava] i{background:#efa797}
.sheet-label{font-size:14px;color:var(--muted);margin:7px 0 1px}.detail-row img{width:36px;height:36px;object-fit:contain}
@media(prefers-reduced-motion:no-preference){.switch::after{transition:background-color .15s}.mode:active{transform:scale(.98)}}

.native-rows{padding-inline:14px}.control{display:flex;align-items:center;gap:10px;width:100%;min-height:53px;border:0;background:transparent;text-align:left;padding:8px 0;font:inherit;color:inherit}.control+.control{border-top:1px solid color-mix(in srgb,var(--edge) 32%,transparent)}.control>span:first-child{flex:1}.control .value{flex:0 1 44%;color:var(--muted);text-align:right;font-size:14px;overflow-wrap:anywhere}.control .icon{width:16px;height:16px;color:var(--muted)}
dialog.fullpage{position:fixed;inset:0;margin:0 auto;width:min(100%,460px);max-width:100%;height:100dvh;max-height:100dvh;border:0;border-radius:0;padding:0 19px 30px;background:color-mix(in srgb,var(--glass) 50%,var(--page))!important}
.fullpage #close{display:none}.fullpage .dialog-head{position:sticky;top:0;z-index:1;justify-content:start;padding:10px 0;gap:12px;background:color-mix(in srgb,var(--glass) 50%,var(--page));margin-bottom:14px}.fullpage #sheet-back{background:var(--glass)}.fullpage .dialog-content{gap:8px}.fullpage .sheet-label,.setting-group h3{font-size:15px;line-height:1.35;color:var(--accent);font-weight:620}.setting-group{margin-top:18px}.setting-group h3{margin-bottom:7px}
.pref,.fact{display:flex;align-items:center;gap:10px;min-height:54px;padding:12px 0}.pref{width:100%;border:0;background:transparent;text-align:left;color:inherit}.pref>span:first-child{flex:1;font-weight:600;line-height:1.35}.pref small,.fact span{display:block;color:var(--muted);font-size:14px;font-weight:400;line-height:1.45;margin-top:4px}.pref .switch{flex:0 0 46px;width:46px;height:28px}.pref .switch::after{width:20px;height:20px}
.fact{display:block;overflow-wrap:anywhere}.range-label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:15px}.range-label output{font-weight:700;color:var(--ink)}#aware-volume{width:100%;margin:0;min-height:44px;accent-color:var(--accent)}.setting-links{margin-top:12px}
</style>
</head>
<body>
<main class="app">

  <header class="top"><div class="brand">AnDPoP</div><button class="ghost" data-open="account">Account</button><button class="icon-button glass" data-open="settings" aria-label="Settings" data-icon="settings"></button></header>
  <h1 id="device">Qyuon’s AirPods Pro</h1><div class="meta"><span id="model">AirPods Pro 2 · USB-C</span><span class="badge" id="badge">Connected</span></div>
  <section class="battery glass page-section" aria-labelledby="battery">
    <div class="card-head"><h2 id="battery">Battery</h2><button class="icon-button" id="refresh" aria-label="Refresh battery readings" data-icon="refresh"></button></div>
    <p id="battery-status" class="battery-status" role="status" hidden></p>
    <div class="batteries" id="readings"></div>
    <div class="footer"><button class="pill glass" data-open="battery">Battery details <span data-icon="chevron" aria-hidden="true"></span></button></div>
  </section>
  <div id="connected-controls">
    <section class="page-section" aria-labelledby="listening"><h2 id="listening">Listening Mode</h2>
      <div class="modes glass"><div class="mode-grid" role="radiogroup" aria-labelledby="listening" id="mode-grid"></div><p class="feedback" id="mode-feedback" role="status"></p></div>
    </section>
    <section class="page-section" id="sound"><h2>Sound</h2><div class="rows glass">
      <button class="row" role="switch" aria-checked="true" data-switch="conversation"><span class="sound-label">Conversation Awareness<small>Lowers media volume when you start speaking and restores it when you stop.</small></span><span class="switch" aria-hidden="true"></span></button>
    </div></section>
<section class="page-section" ><h2>AirPods controls</h2><div class="rows glass native-rows"><button class="control" data-open="rename"><span>Name</span><span class="value" id="name-value"></span><span data-icon="chevron"></span></button><button class="control" role="switch" data-switch="detection" aria-checked="true"><span id="wear-label">Automatic wear detection</span><span class="switch" aria-hidden="true"></span></button><button class="control" data-open="microphone"><span>Microphone</span><span class="value" id="mic-value"></span><span data-icon="chevron"></span></button><button class="control" data-open="accessibility"><span>Accessibility</span><span data-icon="chevron"></span></button></div></section><section class="page-section" id="stems"><h2>Press and Hold AirPods</h2><div class="rows glass native-rows"><button class="control" data-open="left"><span>Left bud</span><span class="value" id="left-action"></span><span data-icon="chevron"></span></button><button class="control" data-open="right"><span>Right bud</span><span class="value" id="right-action"></span><span data-icon="chevron"></span></button></div></section><section class="page-section" ><h2>About</h2><div class="rows glass native-rows"><div class="control" id="about-model"><span>Model Number</span><span class="value">A3048</span></div><button class="control" id="about-firmware" data-open="firmware"><span>Firmware version</span><span class="value">8454480</span><span data-icon="chevron"></span></button><button class="control" data-open="advanced"><span>More device controls</span><span data-icon="chevron"></span></button></div></section>
  </div>
  <section class="page-section" id="disconnected" hidden><h2>Connect your AirPods</h2><p class="copy">Open Bluetooth settings on your phone to connect.</p><button class="pill glass" data-open="troubleshooting">Troubleshooting</button></section>
</main>
<dialog class="glass" id="sheet" aria-labelledby="sheet-title">
  <header class="dialog-head"><button class="icon-button" id="sheet-back" aria-label="Back" data-icon="back" hidden></button><h2 id="sheet-title"></h2><button class="icon-button glass" id="close" aria-label="Close" data-icon="close"></button></header>
  <div class="dialog-content" id="sheet-body"></div>

function renderDashboard() {
  const max = state.scenario === 'max';
  const connected = state.scenario !== 'disconnected';
  $('device').textContent = max ? state.maxName : state.name;
  $('model').textContent = max ? 'AirPods Max' : 'AirPods Pro 2 · USB-C';
  $('badge').textContent = connected ? 'Connected' : 'Disconnected';
  $('sound').hidden = max;
  $('stems').hidden = max;
  $('wear-label').textContent = max ? 'Automatic Head Detection' : 'Automatic wear detection';
  $('connected-controls').hidden = !connected;
  $('disconnected').hidden = connected;
  $('refresh').disabled = !connected;
  $('name-value').textContent = max ? state.maxName : state.name;
  $('about-model').hidden=max; $('about-firmware').hidden=max;
  for(const side of ['left','right']) $(side+'-action').textContent=state[side];

    section('Popup Animations',p('bottomPopup','Bottom sheet popup','Show a popup at the bottom when AirPods connect.')+p('islandPopup','Dynamic Island popup','Show a popup at the top for connection and takeover events.'))+
    section('Conversation Awareness',p('pauseMusic','Pause Music','Pause music when you start speaking.')+p('relativeVolume','Relative volume','Use a percentage of the current volume instead of maximum volume.'))+
    section('Conversation Awareness Volume','<div class="range-label"><span>10%</span><output for="aware-volume" id="volume-label">'+state.settings.volume+'%</output><span>85%</span></div><input id="aware-volume" type="range" aria-label="Conversation Awareness Volume" min="10" max="85" value="'+state.settings.volume+'" aria-valuetext="'+state.settings.volume+'%">')+
    section('Connect to your AirPods when its status is',p('takeDisconnected','Disconnected','AirPods are not connected to a device.')+p('takeIdle','Idle','A device is connected to your AirPods, but is not playing media or on a call.')+p('takePlaying','Playing media','A device is playing media on your AirPods.')+p('takeCall','On call','A device is on a call with your AirPods.'))+
    section('Connect to AirPods when your phone is',p('phoneCall','Receiving a call','Your phone starts ringing.')+p('phoneMedia','Starting media playback','Your phone starts playing media.'))+
    section('Advanced Options',p('alternatePackets','Use alternate head tracking packets','Request head tracking data using alternate packets if standard head tracking does not work.'))+
    '<div class="setting-links">'+row('Troubleshooting','troubleshooting','help')+row('Credits and licenses','credits','book')+'</div>'+
    section('Device information',fact('Manufacturer','samsung')+fact('Model Number','SM-S948B')+fact('Build ID','CP2A.260605.016.S948BXXS6BZK1')+fact('Version','CP2A.260605.016 (3700000)')+fact('Xposed available','No')+fact('App enabled in Xposed','No'));
}
function renderSheet(next) {
  const max = state.scenario === 'max';
  const body = $('sheet-body');
  view = next;
  $('sheet-title').textContent = titles[next];
  $('sheet-back').hidden=trail.length===0;
  sheet.classList.toggle('fullpage',next==='settings');
  $('sheet-back').hidden = !trail.length && next!=='settings';
  sheet.scrollTop=0;
  switch(next) {
    case 'scenarios':
      body.innerHTML = '<p class="copy">Choose a sample to check how the app displays each battery state.</p>'+field('Device state','scenario',Object.entries(scenarios).map(([id,sample])=>[id,sample.name]));
      break;
    case 'settings': body.innerHTML=settingsMarkup(); break;
    case 'credits':
      body.innerHTML = '<p>Based on LibrePods</p><p class="copy">AirPods Pro photo by Hajoon0102 · CC BY-SA 4.0<br>AirPods Max photo by Arne Müseler · CC BY-SA 3.0 DE<br>Wikimedia Commons · Adapted images</p>'+'';
      break;
    case 'battery':
      body.innerHTML = Object.entries(scenarios[state.scenario].values).map(([part,[level,note]]) =>
        '<div class="detail-row"><img alt="" src="'+ART[part]+'"><div class="text">'+parts[part]+(note?'<small>'+note+'</small>':'')+'</div>'+
        (note==='Charging'?chargingIcon(level):icon('battery'))+'<strong>'+(level===null?'—':level+'%')+'</strong></div>').join('')+row('Preview battery states','scenarios','samples');
      break;
    case 'rename':
      body.innerHTML = '<form id="rename-form"><label class="field">AirPods name<input name="deviceName" required maxlength="40"></label><button class="pill primary" type="submit">Save name</button></form>';
      body.querySelector('input').value = max ? state.maxName : state.name;
      break;
    case 'microphone':
      body.innerHTML = max ? '<p class="copy">Automatic</p>' : field('Microphone','microphone',pair(['Automatic','Always Left','Always Right']));
      break;
    case 'accessibility':
      body.innerHTML = field('Press Speed','speed',pair(['Default','Slower','Slowest']))+field('Press and Hold Duration','duration',pair(['Default','Longer','Longest']))+preference('oneBud','Noise Cancellation with One AirPod','Use noise cancellation while wearing one earbud.')+(max?'':preference('loudReduction','Loud Sound Reduction','Reduce loud sounds in Transparency mode.')+preference('volumeControl','Volume Control','Swipe the stem to adjust volume.'));
      break;
    case 'left': case 'right':
      body.innerHTML=field('Press and hold action',next,pair(['Listening Mode','Digital Assistant']))+(state[next]==='Listening Mode'?section('Cycle through listening modes',preference('cycleOff','Off','')+preference('cycleTransparency','Transparency','')+preference('cycleAdaptive','Adaptive','')+preference('cycleCancel','Noise Cancellation','')):'');
      break;
    case 'firmware':
      body.innerHTML=fact('Firmware version','8454480')+fact('Model Number','A3048');
      break;
    case 'advanced':
      body.innerHTML=(max?'':preference('optimal','Optimized Charging','Learn charging habits to reduce battery aging.')+preference('offMode','Off Listening Mode','Include Off among the listening modes.')+preference('sleep','Sleep detection','Pause playback when you fall asleep.'))+row('Microphone','microphone','microphone')+row('Accessibility','accessibility','accessibility')+(max?'':row('Left bud','left','hold')+row('Right bud','right','hold'))+row('Settings','settings','settings');
      break;
    case 'deviceinfo':
      body.innerHTML = '<div class="detail-row"><span>Model</span><strong>'+$('model').textContent+'</strong></div><div class="detail-row"><span>Firmware</span><small>Sample device</small></div>';
      break;
    case 'troubleshooting':
      body.innerHTML = '<p class="copy">Check Nearby devices permission and confirm your AirPods are connected in Android Bluetooth settings. To refresh the case level, open the lid near the phone with an earbud inside.</p>';
      break;
    case 'account':
      body.innerHTML = '<h3>'+ (state.profile==='Guest'?'Guest profile':'Demo account')+'</h3><p class="copy">'+(state.remembered?'Sample AirPods saved to this profile.':'Save this device and its settings for this preview session.')+'</p>'+
        '<button class="pill glass" data-remember>'+ (state.remembered?'Forget sample device':'Remember this device')+'</button>'+(state.profile==='Guest'?row('Log in','login')+row('Create an account','signup'):'<button class="pill glass" data-signout>Sign out</button>');
      break;
    case 'login': case 'signup': case 'recovery': {
      const recovery = next === 'recovery';
      const signup = next === 'signup';
      body.innerHTML = '<p class="copy">Preview only. Use sample details.</p><form id="demo-account"><label class="field">Email address<input type="email" required autocomplete="off" placeholder="you@example.com"></label>'+
        (recovery?'':'<label class="field">Password<input type="password" required autocomplete="off" minlength="'+(signup?8:1)+'"></label>')+
        '<button class="pill primary" type="submit">'+(recovery?'Send reset link':signup?'Create account':'Log in')+'</button><p class="copy" id="account-status" role="status"></p></form>'+
        (next==='login'?row('Forgot password?','recovery','help'):'');
      break;
    }
  }
}
function openSheet(next, trigger) {
  if (!sheet.open) { previousFocus = trigger; trail.length=0; } else if (view!==next) trail.push(view);
  renderSheet(next);
  if (!sheet.open) sheet.showModal();
  (next==='settings'?$('sheet-back'):$('close')).focus({preventScroll:true});
}
$('sheet-back').addEventListener('click',()=>{if(trail.length) renderSheet(trail.pop()); else sheet.close();});
hydrate(document);
applyTheme();
renderDashboard();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();if(sheet.open&&view==='settings'&&state.appearance==='system') renderSheet('settings');});
$('close').addEventListener('click',()=>sheet.close());
sheet.addEventListener('close',()=>previousFocus?.focus());
document.addEventListener('click',event => {
  const button = event.target.closest('button');
  if (!button) return;
  if(button.dataset.setting){
    const key=button.dataset.setting;
    state.settings[key]=!state.settings[key];button.setAttribute('aria-checked',String(state.settings[key]));
  }
  if(button.dataset.pref){
    state[button.dataset.pref]=button.dataset.val;
    applyTheme();
    if(view==='settings' && button.dataset.pref==='appearance'){
      renderSheet(view);sheet.querySelector('[data-pref="appearance"][aria-pressed="true"]').focus({preventScroll:true});
      return;
    }
    button.parentElement.querySelectorAll('button').forEach(choice=>choice.setAttribute('aria-pressed',choice===button));
  }
  if (button.dataset.open) openSheet(button.dataset.open,button);
  if (button.dataset.modeChoice) selectMode(button.dataset.modeChoice,true);
  if (button.dataset.switch) { const key=button.dataset.switch; state[key]=!state[key]; renderDashboard(); }
  if(button.hasAttribute('data-signout')){switchProfile('Guest'); renderSheet('account');}
  if (button.hasAttribute('data-remember')) { state.remembered=!state.remembered; renderSheet('account'); }
});
$('mode-grid').addEventListener('keydown',event => {
  if (!['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','Home','End'].includes(event.key)) return;
  event.preventDefault();
  const buttons=[...$('mode-grid').querySelectorAll('button')];
  const index=buttons.indexOf(document.activeElement);
  const offset=['ArrowRight','ArrowDown'].includes(event.key)?1:-1;
  const position=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+offset+buttons.length)%buttons.length;
  selectMode(buttons[position].dataset.modeChoice,true);
});
sheet.addEventListener('input',e=>{
  if(e.target.id!=='aware-volume')return;
  state.settings.volume=Number(e.target.value);
  $('volume-label').value=e.target.value+'%';
  e.target.setAttribute('aria-valuetext',$('volume-label').value);
});
sheet.addEventListener('change',event => {
  const key=event.target.dataset.field;
  if (!key) return;
  state[key]=event.target.value;
  if(key==='left'||key==='right'){renderSheet(key);sheet.querySelector('select').focus();}
  if (key==='scenario') { clearTimeout(refreshTimer); $('battery-status').hidden=true; }
  applyTheme();
  renderDashboard();
});
sheet.addEventListener('submit',event => {
  event.preventDefault();
  if (event.target.id==='rename-form') {
    const name=new FormData(event.target).get('deviceName').trim();
    if (name) { state[state.scenario==='max'?'maxName':'name']=name; renderDashboard(); sheet.close(); }
  } else {
    if(view==='recovery'){
      $('account-status').textContent='Reset link preview complete. No email sent.';
      event.target.reset();
    } else {
      const email=event.target.querySelector('[type=email]').value.trim().toLowerCase();
      event.target.reset();
      switchProfile(email);
      trail.length=0; renderSheet('account');
    }
  }
});
$('refresh').addEventListener('click',()=>{
  const status=$('battery-status');
  status.hidden=false;
  status.textContent='Checking battery…';
  clearTimeout(refreshTimer);
  refreshTimer=setTimeout(()=>{
    status.textContent=state.scenario==='missing'?'Battery readings unavailable. Open the case near your phone.':'Sample readings refreshed.';
  },550);
});
</script>
</body>
</html>
