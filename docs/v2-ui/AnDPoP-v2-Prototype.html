<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnDPoP 2.0 · UI/UX prototype</title>
<style>
/* ───────────── Workbench (neutral, outside the phone) ───────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:#0d0f12}
body{font-family:"Roboto Flex","Google Sans Text","Google Sans",Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;background:#0d0f12;color:#e4e7ea;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wb{display:grid;grid-template-columns:268px minmax(0,1fr) 336px;height:100vh}
.wb-nav,.wb-notes{overflow:auto;background:#14171b;padding:18px 16px 40px;scrollbar-width:thin}
.wb-nav{border-right:1px solid #22262c}.wb-notes{border-left:1px solid #22262c}
.wb-brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.wb-brand b{font-size:15px;letter-spacing:.2px}.wb-brand span{display:block;font-size:12px;color:#8c949c}
.wb-h{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#7d858d;margin:18px 4px 8px}
.wb-ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.wb-ctl button,.wb-sel{height:30px;padding:0 10px;border-radius:8px;background:#1d2126;border:1px solid #2a2f36;font-size:12.5px;color:#c9ced3}
.wb-ctl button.on{background:#25414a;border-color:#3e6c78;color:#e8f7fb}
.wb-sel{width:100%;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8c949c 50%),linear-gradient(135deg,#8c949c 50%,transparent 50%);background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px;background-size:5px 5px;background-repeat:no-repeat}
.wb-list a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;color:#c3c9cf;text-decoration:none;cursor:pointer}
.wb-list a:hover{background:#1b1f24}.wb-list a.on{background:#203840;color:#eaf8fb}
.wb-list a small{margin-left:auto;font-size:10.5px;color:#7d858d}
.wb-stage{position:relative;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:28px 20px 40px;background:radial-gradient(80% 60% at 50% 0%,#1a2026,#0d0f12)}
.wb-stage.board-mode{display:block;padding:28px}
.wb-cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#7d858d;pointer-events:none}
.wb-notes h2{font-size:17px;margin-bottom:4px}.wb-notes .sub{font-size:12.5px;color:#8c949c;margin-bottom:14px;line-height:1.45}
.wb-notes h3{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#7d858d;margin:16px 0 6px}
.wb-notes ul{padding-left:16px}.wb-notes li{font-size:12.8px;line-height:1.5;color:#c9ced3;margin-bottom:5px}
.wb-notes code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:#1d2126;padding:1px 5px;border-radius:5px;color:#bfe6ef;word-break:break-word}
.wb-notes .chg{border-left:2px solid #3e6c78;padding:2px 0 2px 10px;margin:6px 0}
.wb-tip{font-size:12px;color:#8c949c;line-height:1.5;margin-top:10px}
.wb-tip kbd{font-family:inherit;background:#1d2126;border:1px solid #2a2f36;border-radius:5px;padding:0 5px}
.wb-toggle{display:none}
body.shot .wb{grid-template-columns:1fr}body.shot .wb-nav,body.shot .wb-notes,body.shot .wb-cap{display:none}
body.shot .wb-stage{padding:16px;background:#0d0f12;overflow:visible}
body.shot.is-board .wb-stage{padding:0;background:#0d0f12}
@media (max-width:1100px){.wb{grid-template-columns:240px minmax(0,1fr)}.wb-notes{display:none}.wb-notes.open{display:block;position:fixed;right:0;top:0;bottom:0;width:340px;z-index:50;box-shadow:-20px 0 40px #0008}.wb-toggle{display:block;position:fixed;right:14px;bottom:14px;z-index:60;height:40px;padding:0 16px;border-radius:20px;background:#25414a;color:#e8f7fb;font-size:13px;font-weight:600}}
@media (max-width:760px){.wb{grid-template-columns:1fr;height:auto}.wb-nav{max-height:none;border-right:0;border-bottom:1px solid #22262c}.wb-stage{padding:16px 0 80px}}

/* ───────────── Design tokens (inside the phone and boards) ───────────── */
.tk[data-theme=dark]{color-scheme:dark;--ok:#7BE0A0;--okc:rgba(123,224,160,.14);--warn:#FFB68A;--warnc:rgba(255,182,138,.14);--err:#FFB4AB;--errc:rgba(255,180,171,.13);--charge:#69D447;--bolt:#0E1A12;--boltedge:#F1F9E9;--scrim:rgba(0,0,0,.55);--elev:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.28);--white-well:#F3F5F6}
.tk[data-theme=light]{color-scheme:light;--ok:#1B7A43;--okc:rgba(27,122,67,.10);--warn:#A3470F;--warnc:rgba(163,71,15,.10);--err:#B3261E;--errc:rgba(179,38,30,.08);--charge:#3AAA35;--bolt:#0E1A12;--boltedge:#F6FBEF;--scrim:rgba(10,15,20,.36);--elev:0 1px 2px rgba(20,30,40,.06),0 8px 24px rgba(20,30,40,.08);--white-well:#FFFFFF}
.tk[data-theme=dark][data-palette=glacier]{--bg:#0A1D23;--glow:#1F5A68;--s1:#112830;--s2:#173239;--s3:#1E3C45;--s4:#284952;--line:rgba(214,240,246,.07);--line2:rgba(214,240,246,.15);--on:#E6F4F7;--on2:#A9C3C9;--on3:#7E99A0;--pri:#8ED4E4;--onpri:#00313B;--pc:#1D4C58;--onpc:#CFF2FA}
.tk[data-theme=dark][data-palette=iris]{--bg:#141128;--glow:#3D3478;--s1:#1C1834;--s2:#24203E;--s3:#2D2849;--s4:#383257;--line:rgba(230,224,255,.07);--line2:rgba(230,224,255,.15);--on:#EEEAFF;--on2:#BDB6DA;--on3:#8E87AC;--pri:#CBBEFF;--onpri:#2A1E5C;--pc:#3A3068;--onpc:#E8DFFF}
.tk[data-theme=dark][data-palette=guava]{--bg:#22111A;--glow:#6B2840;--s1:#2C1922;--s2:#36212B;--s3:#422935;--s4:#4F3341;--line:rgba(255,226,234,.07);--line2:rgba(255,226,234,.15);--on:#FFEEF2;--on2:#DDBAC5;--on3:#AD8C97;--pri:#FFB3C6;--onpri:#581A2E;--pc:#6A2C41;--onpc:#FFD9E2}
.tk[data-theme=light][data-palette=glacier]{--bg:#EDF6F8;--glow:#BDE6EF;--s1:#FFFFFF;--s2:#E2EFF2;--s3:#D3E5EA;--s4:#C4DBE1;--line:rgba(16,39,45,.07);--line2:rgba(16,39,45,.16);--on:#10272D;--on2:#45626A;--on3:#516D73;--pri:#1D6374;--onpri:#FFFFFF;--pc:#CBEAF2;--onpc:#03313C}
.tk[data-theme=light][data-palette=iris]{--bg:#F5F2FF;--glow:#DCD2FF;--s1:#FFFFFF;--s2:#ECE7FA;--s3:#E0D9F4;--s4:#D3CBEC;--line:rgba(29,24,50,.07);--line2:rgba(29,24,50,.16);--on:#1D1832;--on2:#585172;--on3:#67608A;--pri:#5A4A99;--onpri:#FFFFFF;--pc:#E5DDFF;--onpc:#1B0F4A}
.tk[data-theme=light][data-palette=guava]{--bg:#FFF3F1;--glow:#FFD6DD;--s1:#FFFFFF;--s2:#FBE8E7;--s3:#F5DADB;--s4:#EDCACD;--line:rgba(46,21,25,.07);--line2:rgba(46,21,25,.16);--on:#2E1519;--on2:#6D4E55;--on3:#7A5D64;--pri:#8D3954;--onpri:#FFFFFF;--pc:#FFD9E2;--onpc:#3B0717}

/* ───────────── Phone frame ───────────── */
.ph{--fs:1;position:relative;width:calc(var(--w) * 1px + 20px);border-radius:46px;padding:10px;background:#050607;box-shadow:0 0 0 1.5px #2b3036,0 30px 80px rgba(0,0,0,.55);flex:none}
.ph-in{position:relative;height:calc(var(--h) * 1px);border-radius:36px;overflow:hidden;clip-path:inset(0 round 36px);background:var(--bg);color:var(--on);isolation:isolate}
.ph.tall .ph-in{height:auto;min-height:calc(var(--h) * 1px)}
.ph.tall .scr{position:relative;height:auto;overflow:visible}
.ph.tall .host{position:relative}
.sb{position:absolute;top:0;left:0;right:0;height:34px;padding:0 22px 0 26px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;z-index:30;pointer-events:none;color:var(--on)}
.sb .cam{position:absolute;left:50%;top:10px;width:12px;height:12px;border-radius:50%;background:#000;transform:translateX(-50%)}
.sb-ic{display:flex;gap:6px;align-items:center}
.gb{position:absolute;left:0;right:0;bottom:0;height:22px;display:flex;align-items:center;justify-content:center;z-index:30;cursor:pointer}
.gb i{width:108px;height:4px;border-radius:2px;background:var(--on);opacity:.55}
.host{position:absolute;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:28px;scrollbar-width:none;background:radial-gradient(130% 46% at 50% -8%,color-mix(in srgb,var(--glow) 58%,transparent),transparent 62%),var(--bg)}
.scr::-webkit-scrollbar{display:none}
.scr.enter-push{animation:pushIn .32s cubic-bezier(.2,0,0,1) both}
.scr.enter-pop{animation:popIn .32s cubic-bezier(.2,0,0,1) both}
.scr.enter-fade{animation:fadeIn .4s ease both}
@keyframes pushIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ───────────── Type scale (scaled by --fs, the Android font scale) ───────────── */
.tk{--fs:1;font-family:"Roboto Flex","Google Sans Text","Google Sans",Roboto,system-ui,sans-serif}
.t-disp{font-size:calc(32px*var(--fs));line-height:1.22;font-weight:650;letter-spacing:-.4px}
.t-hl{font-size:calc(28px*var(--fs));line-height:1.25;font-weight:600;letter-spacing:-.2px}
.t-tl{font-size:calc(22px*var(--fs));line-height:1.27;font-weight:620;letter-spacing:-.1px}
.t-tm{font-size:calc(16px*var(--fs));line-height:1.5;font-weight:600;letter-spacing:.1px}
.t-bl{font-size:calc(16px*var(--fs));line-height:1.45}
.t-bm{font-size:calc(14px*var(--fs));line-height:1.43}
.t-bs{font-size:calc(12.5px*var(--fs));line-height:1.4}
.t-ll{font-size:calc(14px*var(--fs));line-height:1.43;font-weight:600;letter-spacing:.1px}
.t-lm{font-size:calc(12px*var(--fs));line-height:1.33;font-weight:600;letter-spacing:.3px}
.t-ls{font-size:calc(11px*var(--fs));line-height:1.45;font-weight:600;letter-spacing:.4px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.on2{color:var(--on2)}.on3{color:var(--on3)}.pri{color:var(--pri)}.okc-t{color:var(--ok)}.warn-t{color:var(--warn)}.err-t{color:var(--err)}

/* ───────────── Layout primitives ───────────── */
.page{padding:0 16px 32px}
.tb{position:sticky;top:0;padding:34px 8px 0 8px;height:98px;display:flex;align-items:center;gap:4px;z-index:20;transition:background .2s,box-shadow .2s}
.tb.raised{background:color-mix(in srgb,var(--s2) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 1px 0 var(--line)}
.tb .tb-t{flex:1;min-width:0;padding-left:6px;opacity:0;transform:translateY(6px);transition:.22s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.raised .tb-t,.tb.always .tb-t{opacity:1;transform:none}
.tb .sp{flex:1}
.brand{display:flex;align-items:center;gap:10px;padding-left:8px;flex:1}
.lt{padding:8px 8px 4px}.lt p{margin-top:6px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:22px 8px 10px;color:var(--on2)}
.stack{display:flex;flex-direction:column;gap:12px}
.hr{height:1px;background:var(--line);margin:4px 0}
.center{text-align:center}

/* Cards and connected list groups (Material 3 Expressive list style) */
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px}
.group{display:flex;flex-direction:column;gap:2px}
.row{position:relative;display:flex;align-items:center;gap:16px;min-height:calc(56px*var(--fs));padding:12px 16px;background:var(--s1);border-radius:6px;text-align:left;width:100%;overflow:hidden}
.group>.row:first-child{border-top-left-radius:24px;border-top-right-radius:24px}
.group>.row:last-child{border-bottom-left-radius:24px;border-bottom-right-radius:24px}
.row.tap{cursor:pointer}.row.tap:active{background:var(--s2)}
.row .lead{flex:none;color:var(--pri);display:flex}
.row .chip-lead{flex:none;width:40px;height:40px;border-radius:14px;background:var(--pc);color:var(--onpc);display:grid;place-items:center}
.row .tx{flex:1;min-width:0}
.row .t1{font-size:calc(16px*var(--fs));line-height:1.4;color:var(--on)}
.row .t2{font-size:calc(13.5px*var(--fs));line-height:1.4;color:var(--on2);margin-top:2px}
.row .val{flex:none;max-width:46%;text-align:right;font-size:calc(14px*var(--fs));color:var(--on2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{flex:none;color:var(--on3);display:flex;margin-left:-8px}
.row.dis{opacity:.45;pointer-events:none}
.row .val2{display:none}
.ph.big .row .val{display:none}
.ph.big .row .val2{display:block}
.row .ext{color:var(--on3);display:flex}

/* Icon button */
.ibtn{position:relative;flex:none;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--on);background:transparent;transition:background .15s}
.ibtn::before{content:"";position:absolute;inset:-4px}
.ibtn.tonal{background:var(--s2)}.ibtn.tonal:active{background:var(--s3)}
.ibtn:active{background:var(--s2)}
.ibtn:disabled{opacity:.4}
.avatar{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--pc);color:var(--onpc);font-weight:700;font-size:14px;letter-spacing:.3px}

/* Buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:calc(48px*var(--fs));padding:10px 24px;border-radius:999px;font-size:calc(15px*var(--fs));font-weight:600;letter-spacing:.1px;transition:background .15s,opacity .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.lg{min-height:calc(56px*var(--fs));font-size:calc(16px*var(--fs))}
.btn.full{width:100%}
.btn.filled{background:var(--pri);color:var(--onpri)}
.btn.tonal{background:var(--pc);color:var(--onpc)}
.btn.outlined{border:1px solid var(--line2);color:var(--pri)}
.btn.text{color:var(--pri);padding:10px 14px}
.btn.danger{color:var(--err)}
.btn.danger.outlined{border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.btn.danger.filled{background:var(--err);color:var(--bg)}
.btn:disabled{opacity:.38;pointer-events:none}
.btn .spin{width:18px;height:18px;border-radius:50%;border:2.4px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link{display:inline-flex;align-items:center;gap:2px;color:var(--pri);font-weight:600;font-size:calc(14px*var(--fs));min-height:40px;padding:0 6px 0 12px;border-radius:20px}
.link:active{background:var(--pc)}

/* Switch (M3, check icon in thumb) */
.sw{position:relative;flex:none;width:52px;height:32px;border-radius:16px;background:var(--s3);box-shadow:inset 0 0 0 2px var(--on3);transition:background .2s,box-shadow .2s}
.sw i{position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--on3);transition:all .25s cubic-bezier(.3,1.4,.5,1);display:grid;place-items:center;color:transparent}
.sw.on{background:var(--pri);box-shadow:none}
.sw.on i{top:4px;left:24px;width:24px;height:24px;background:var(--onpri);color:var(--pri)}
.row:active .sw i{transform:scale(1.12)}

/* Radio / checkbox */
.rad{flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--on2);display:grid;place-items:center;transition:.15s}
.rad.on{box-shadow:inset 0 0 0 2px var(--pri)}.rad.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pri)}
.chk{flex:none;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--on2);display:grid;place-items:center;color:transparent;transition:.15s}
.chk.on{background:var(--pri);box-shadow:none;color:var(--onpri)}
.chk.lock{opacity:.55}

/* Segmented button */
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;min-height:calc(44px*var(--fs))}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;font-size:calc(14px*var(--fs));font-weight:600;color:var(--on);border-left:1px solid var(--line2);transition:background .2s}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--pc);color:var(--onpc)}
.seg button .ck{display:none}.seg button.on .ck{display:flex}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:calc(36px*var(--fs));padding:6px 14px;border-radius:10px;border:1px solid var(--line2);font-size:calc(14px*var(--fs));font-weight:600;color:var(--on2);transition:.15s}
.chip.on{background:var(--pc);border-color:transparent;color:var(--onpc)}
.chip .ck{display:none}.chip.on .ck{display:flex}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:calc(12px*var(--fs));font-weight:600;background:var(--s3);color:var(--on2)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okc);color:var(--ok)}.pill.warn{background:var(--warnc);color:var(--warn)}.pill.err{background:var(--errc);color:var(--err)}
.pill.pulse i{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* Slider */
.sld{padding:4px 0}
.sld-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.sld-val{font-weight:700;color:var(--pri)}
.sld input{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;--p:50%}
.sld input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--pri) var(--p),var(--s3) var(--p))}
.sld input::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:28px;margin-top:-10px;border-radius:3px;background:var(--pri);box-shadow:0 0 0 4px var(--s1)}
.sld input::-moz-range-track{height:8px;border-radius:4px;background:var(--s3)}
.sld input::-moz-range-progress{height:8px;border-radius:4px;background:var(--pri)}
.sld input::-moz-range-thumb{width:6px;height:28px;border-radius:3px;background:var(--pri);border:0}
.sld-ends{display:flex;justify-content:space-between;color:var(--on3)}

/* Text field */
.tf{display:block;position:relative}
.tf label{display:block;font-size:calc(12.5px*var(--fs));font-weight:600;color:var(--on2);margin:0 4px 6px}
.tf .box{display:flex;align-items:center;gap:8px;min-height:calc(56px*var(--fs));padding:0 8px 0 16px;border-radius:16px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line2);transition:box-shadow .15s}
.tf .box:focus-within{box-shadow:inset 0 0 0 2px var(--pri)}
.tf.bad .box{box-shadow:inset 0 0 0 2px var(--err)}
.tf input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:calc(16px*var(--fs));color:var(--on);height:100%;padding:14px 0}
.tf input::placeholder{color:var(--on3)}
.tf .help{font-size:calc(12.5px*var(--fs));color:var(--on2);margin:6px 4px 0}
.tf.bad .help{color:var(--err)}

/* Banner, snackbar, sheet, dialog */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--pc);color:var(--onpc)}
.banner.warn{background:var(--warnc);color:var(--on)}.banner.warn .bi{color:var(--warn)}
.banner.err{background:var(--errc);color:var(--on)}.banner.err .bi{color:var(--err)}
.banner .bi{flex:none;display:flex;margin-top:1px}
.layer{position:absolute;inset:0;z-index:40;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s;pointer-events:auto}
.layer.show .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--s1);border-radius:28px 28px 0 0;padding:0 20px 34px;pointer-events:auto;transform:translateY(100%);transition:transform .34s cubic-bezier(.2,0,0,1);box-shadow:var(--elev);scrollbar-width:none}
.layer.show .sheet{transform:none}
.handle{width:32px;height:4px;border-radius:2px;background:var(--on3);opacity:.6;margin:12px auto 10px}
.dialog{position:absolute;left:50%;top:50%;width:min(320px,calc(100% - 48px));max-height:80%;overflow:auto;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:.22s cubic-bezier(.2,0,0,1);background:var(--s2);border-radius:28px;padding:24px 24px 18px;pointer-events:auto;box-shadow:var(--elev)}
.layer.show .dialog{transform:translate(-50%,-50%);opacity:1}
.dialog .dh{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.dialog .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:18px}
.snack{position:absolute;left:16px;right:16px;bottom:40px;z-index:45;display:flex;align-items:center;gap:12px;min-height:48px;padding:12px 8px 12px 16px;border-radius:14px;background:var(--on);color:var(--bg);font-size:calc(14px*var(--fs));box-shadow:var(--elev);transform:translateY(20px);opacity:0;transition:.25s cubic-bezier(.2,0,0,1);pointer-events:none}
.snack.show{transform:none;opacity:1;pointer-events:auto}
.snack span{flex:1}.snack button{color:color-mix(in srgb,var(--pri) 60%,var(--bg));font-weight:700;padding:6px 10px;border-radius:8px;filter:invert(0)}
.tk[data-theme=dark] .snack button{color:var(--onpc);background:transparent}
.tk[data-theme=light] .snack button{color:var(--pc)}

/* Ripple */
.rp{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);animation:rip .55s cubic-bezier(.2,0,0,1) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* ───────────── Dashboard ───────────── */
.hero{position:relative;padding:18px 16px 10px;border-radius:28px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 62%,var(--s1)) 0%,var(--s1) 72%);border:1px solid var(--line);overflow:hidden}
.hero-top{display:flex;gap:12px;align-items:flex-start;padding:0 4px}
.hero-id{flex:1;min-width:0}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}
.batt{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);margin:14px 0 4px;border-radius:20px;cursor:pointer;position:relative}
.batt:active{background:color-mix(in srgb,var(--s2) 50%,transparent)}
.bcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;position:relative}
.bcell+.bcell::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--line2)}
.bimg{height:calc(76px*min(var(--fs),1.15));display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
.bimg img{max-height:100%;max-width:92px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.bimg.case img{max-width:96px}
.bpct{font-size:calc(24px*var(--fs));line-height:1.15;font-weight:700;letter-spacing:-.3px}
.bpct.muted{color:var(--on3)}.bpct.low{color:var(--warn)}
.blabel{font-size:calc(12.5px*var(--fs));color:var(--on2);font-weight:500}
.bstat{min-height:calc(22px*var(--fs));display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:4px}
.bstat .t-ls{color:var(--on3)}.bstat .t-ls.low{color:var(--warn)}
.batt.rows{grid-template-columns:1fr}
.batt.rows .bcell{flex-direction:row;gap:12px;padding:10px 6px;align-items:center}
.batt.rows .bcell::before{display:none}
.batt.rows .bimg{height:40px;width:44px;margin:0}
.batt.rows .bimg img{max-width:44px}
.batt.rows .bmid{flex:1;display:flex;flex-direction:column}
.batt.rows .bstat{align-items:flex-end;margin:0}
.batt.loading .bpct,.batt.loading .bimg img{animation:fadePulse 1s ease-in-out infinite}
@keyframes fadePulse{50%{opacity:.35}}
.shimmer::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--on) 9%,transparent) 50%,transparent 70%);background-size:220% 100%;animation:shim 1.1s linear infinite;pointer-events:none}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 0 6px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.max-hero{display:flex;gap:16px;align-items:center;margin:14px 4px 8px}
.max-photo{flex:none;width:calc(124px*min(var(--fs),1.2));aspect-ratio:330/315;border-radius:22px;background:var(--white-well);overflow:hidden;display:grid;place-items:center}
.max-photo img{width:100%;height:100%;object-fit:cover}
.spinning{animation:spin 1s linear infinite}

/* Listening mode control */
.lm{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(max-content,1fr));gap:4px;padding:4px;border-radius:24px;background:var(--s2)}
.lm.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.lm.one{grid-template-columns:1fr}
.lm.one button{flex-direction:row;justify-content:flex-start;gap:14px;min-height:calc(52px*var(--fs));padding:10px 16px}
.lm.one button.on{background:var(--pc)}
.lm-ind.noanim{transition:none}
.lm-ind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:20px;background:var(--pc);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .42s cubic-bezier(.3,1.25,.4,1);z-index:0}
.lm button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:calc(76px*var(--fs));padding:10px 10px;border-radius:20px;color:var(--on2);transition:color .25s,background .25s}
.lm button .lbl{font-size:calc(12.5px*var(--fs));font-weight:600;white-space:nowrap;letter-spacing:.1px}
.lm button.on{color:var(--onpc)}
.lm.grid button.on{background:var(--pc)}
.lm .ck{position:absolute;top:7px;right:8px;color:var(--ok);opacity:0;transform:scale(.4);transition:.25s cubic-bezier(.3,1.4,.5,1)}
.lm button.on .ck{opacity:1;transform:none}
.lm-desc{display:flex;gap:10px;align-items:center;padding:12px 8px 4px;color:var(--on2)}
.lm-desc span{transition:opacity .2s}

/* Press-and-hold tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles.one{grid-template-columns:1fr}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:22px;background:var(--s1);border:1px solid var(--line);text-align:left;cursor:pointer}
.tile:active{background:var(--s2)}
.tile .lr{width:32px;height:32px;border-radius:11px;background:var(--pc);color:var(--onpc);display:grid;place-items:center;font-weight:800;font-size:13px}
.tile .chev{position:absolute;right:12px;top:18px;color:var(--on3)}

/* Empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 20px 22px}
.orb{position:relative;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--pc),color-mix(in srgb,var(--pc) 30%,transparent) 70%);color:var(--onpc);margin-bottom:6px}
.orb::before,.orb::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--pri) 35%,transparent);animation:ring 2.4s ease-out infinite}
.orb::after{animation-delay:1.2s}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.25);opacity:0}}
.orb.still::before,.orb.still::after{display:none}
.steps{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--s1);border-radius:6px}
.step:first-child{border-radius:22px 22px 6px 6px}.step:last-child{border-radius:6px 6px 22px 22px}
.step b{flex:none;width:26px;height:26px;border-radius:13px;background:var(--pc);color:var(--onpc);display:grid;place-items:center;font-size:13px}
.step.done b{background:var(--ok);color:var(--bg)}
.step.cur{box-shadow:inset 0 0 0 2px var(--pri)}
.skel{background:var(--s2);border-radius:12px;position:relative;overflow:hidden}

/* Onboarding */
.ob{display:flex;flex-direction:column;min-height:calc(100% - 62px);padding:12px 24px 24px}
.tb+.ob{min-height:calc(100% - 126px)}
.ob-art{flex:1;display:flex;align-items:center;justify-content:center;min-height:250px;position:relative}
.ob-bottom{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0 8px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--s4);transition:.3s}
.dots i.on{width:24px;background:var(--pri)}
.float{position:absolute;filter:drop-shadow(0 18px 24px rgba(0,0,0,.28));animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.glowdisc{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pri) 30%,transparent),transparent 68%)}
.perm{display:flex;gap:14px;align-items:center;padding:14px 14px 14px 16px;background:var(--s1);border-radius:6px}
.perm-ic{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--s2);color:var(--pri);transition:.25s}
.perm.ok .perm-ic{background:var(--okc);color:var(--ok)}
.perm .tag{display:block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--pri);margin-bottom:1px}
.perm .state{flex:none}
.sysdlg{position:absolute;left:20px;right:20px;bottom:40px;background:var(--s2);border-radius:28px;padding:24px 20px 14px;pointer-events:auto;text-align:center;transform:translateY(30px);opacity:0;transition:.25s cubic-bezier(.2,0,0,1);box-shadow:var(--elev)}
.layer.show .sysdlg{transform:none;opacity:1}
.sysdlg .opts{display:flex;flex-direction:column;gap:4px;margin-top:18px}
.sysdlg .opts button{min-height:48px;border-radius:24px;background:var(--s3);font-weight:600;font-size:14.5px;color:var(--on)}
.sysdlg .opts button.p{background:var(--pri);color:var(--onpri)}

/* Settings: appearance preview cards and palette swatches */
.app-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;background:var(--s1);border-radius:24px 24px 6px 6px}
.app-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px 10px;border-radius:18px;cursor:pointer;transition:background .2s}
.app-card .mini{width:100%;max-width:84px;aspect-ratio:3/4.2;border-radius:14px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px var(--line2);transition:box-shadow .2s}
.app-card.on .mini{box-shadow:inset 0 0 0 2.5px var(--pri)}
.app-card .mini i{position:absolute;left:10%;right:10%;height:12%;border-radius:6px}
.app-card .lbl{display:flex;align-items:center;gap:6px}
.swatches{display:flex;justify-content:space-around;gap:8px;padding:14px 12px 12px;background:var(--s1);border-radius:6px 6px 24px 24px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-width:64px}
.swatch .dot{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:transform .2s,box-shadow .2s;overflow:hidden}
.swatch .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,transparent 50%,var(--sw2) 50%)}
.swatch.on .dot{box-shadow:0 0 0 3px var(--s1),0 0 0 5.5px var(--pri)}
.swatch .dot .ck{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--s1);color:var(--pri);display:none;place-items:center}
.swatch.on .dot .ck{display:grid}
.foot{padding:24px 12px 8px;text-align:center;color:var(--on3)}

/* Equalizer */
.eqcard{padding:16px 14px 10px;border-radius:24px;background:var(--s1)}
.eqcard svg{width:100%;height:150px;display:block}

/* Head gesture test */
.headviz{display:grid;place-items:center;height:150px;border-radius:24px;background:var(--s1);position:relative;overflow:hidden}
.headviz .hd{transition:transform .3s}
.headviz.nod .hd{animation:nod .5s ease-in-out 3}
.headviz.shake .hd{animation:shake .45s ease-in-out 3}
@keyframes nod{50%{transform:translateY(10px) rotateX(20deg)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

/* ───────────── Outside-the-app surfaces ───────────── */
.home{position:absolute;inset:0;padding-top:34px;background:radial-gradient(80% 50% at 20% 10%,color-mix(in srgb,var(--pri) 45%,transparent),transparent 60%),radial-gradient(70% 50% at 90% 90%,color-mix(in srgb,var(--glow) 90%,transparent),transparent 60%),linear-gradient(160deg,var(--s3),var(--bg))}
.home-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px;padding:20px 22px}
.home-app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--on)}
.home-app i{width:54px;height:54px;border-radius:50%;background:color-mix(in srgb,var(--s1) 70%,transparent);display:block}
.wdg{margin:0 16px 14px;padding:14px;border-radius:26px;background:color-mix(in srgb,var(--s1) 92%,transparent);box-shadow:var(--elev)}
.wdg-b{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ring{position:relative;width:54px;height:54px;margin:0 auto}
.ring>svg{position:absolute;inset:0}
.ring .ri{position:absolute;inset:0;display:grid;place-items:center;color:var(--on2)}
.wdg-cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.wdg-lm{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:22px;background:var(--s2)}
.wdg-lm span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:18px;font-size:11px;font-weight:600;color:var(--on2)}
.wdg-lm span.on{background:var(--pc);color:var(--onpc)}
.popup{position:absolute;left:10px;right:10px;bottom:14px;padding:12px 18px 22px;border-radius:32px;background:var(--s1);box-shadow:0 20px 60px rgba(0,0,0,.45);animation:popUp .5s cubic-bezier(.2,0,0,1) both}
@keyframes popUp{from{transform:translateY(110%)}to{transform:none}}
.island{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:calc(100% - 24px);border-radius:28px;background:#000;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:31;animation:isl .6s cubic-bezier(.3,1.3,.5,1) both;transform-origin:50% 0}
@keyframes isl{from{width:88px;height:30px;padding:0;opacity:.7}to{}}
.island .ib{width:44px;height:44px;border-radius:14px;background:#1d2226;display:grid;place-items:center;flex:none}
.shade{position:absolute;inset:0;padding:40px 12px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px)}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.qs-t{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 14px;border-radius:24px;background:var(--s2);color:var(--on)}
.qs-t.on{background:var(--pri);color:var(--onpri)}
.qs-t .q2{font-size:12px;opacity:.8}
.notif{border-radius:24px;background:var(--s1);padding:14px 16px;margin-bottom:8px}
.notif .nh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--on2);margin-bottom:8px}
.notif .acts{display:flex;gap:8px;margin-top:12px}
.notif .acts span{padding:8px 14px;border-radius:16px;background:var(--s2);font-size:13px;font-weight:600;color:var(--pri)}
.nbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.nbar div{font-size:12px;color:var(--on2)}
.nbar .tr{height:6px;border-radius:3px;background:var(--s3);margin-top:5px;overflow:hidden}
.nbar .tr b{display:block;height:100%;background:var(--pri);border-radius:3px}
.nbar .tr b.c{background:var(--charge)}

/* ───────────── Boards (design system, store assets) ───────────── */
.board{max-width:1180px;margin:0 auto;background:var(--bg);color:var(--on);border-radius:28px;padding:32px;box-shadow:0 0 0 1px #2b3036}
body.shot .board{border-radius:0;box-shadow:none;max-width:none;width:1280px}
.board>h1{font-size:28px;font-weight:650;margin-bottom:6px}
.board>h2{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--on2);margin:30px 0 12px}
.board .lead{color:var(--on2);font-size:14.5px;max-width:760px;line-height:1.5}
.bgrid{display:grid;gap:14px}
.sw-tile{border-radius:18px;overflow:hidden;background:var(--s1);border:1px solid var(--line)}
.sw-tile div{height:64px}
.sw-tile p{padding:8px 12px;font-size:12px;line-height:1.35}
.sw-tile p b{display:block;font-size:12.5px}
.sw-tile p span{color:var(--on3);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.specimen{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:24px;background:var(--s1)}
.specimen .meta{font-size:11.5px;color:var(--on3);font-family:ui-monospace,Menlo,Consolas,monospace}
.comp{padding:18px;border-radius:24px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.comp>.cap{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--on3)}
.comp .rowx{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.comp .surface{background:var(--bg);border-radius:18px;padding:12px}
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable td,.mtable th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.mtable th{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--on3)}
.mini-ph{color:var(--on);width:calc(var(--mw) * 1px);height:calc(var(--mw) * 2.1667px);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 0 0 5px #050607,0 18px 40px rgba(0,0,0,.4);background:var(--bg)}
.mini-ph .inner{position:absolute;left:0;top:0;width:384px;height:832px;transform-origin:0 0;pointer-events:none}
.mini-ph .inner .scr{overflow:hidden}
.shot-frame{border-radius:20px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 14px 0;background:linear-gradient(170deg,var(--pc),var(--bg))}
.shot-frame h4{font-size:17px;line-height:1.25;text-align:center;font-weight:650;color:var(--on);max-width:200px}
.fg{position:relative;width:1024px;height:500px;transform-origin:0 0;border-radius:0;overflow:hidden;display:flex;align-items:center;padding:0 72px;gap:40px;background:radial-gradient(60% 90% at 85% 50%,color-mix(in srgb,var(--pri) 30%,transparent),transparent 70%),linear-gradient(120deg,var(--bg),color-mix(in srgb,var(--pc) 70%,var(--bg)))}
.icon-wrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.icon-wrap figure{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12px;color:var(--on2)}
.listing{font-size:13.5px;line-height:1.55;color:var(--on)}
.listing dt{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--on3);margin-top:14px}
.listing dd{margin-top:4px}
.listing .cnt{color:var(--on3);font-size:12px}
.chk-list li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;margin-bottom:8px}
.chk-list li .s{flex:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.s.ui{background:var(--pc);color:var(--onpc)}.s.code{background:var(--warnc);color:var(--warn)}.s.store{background:var(--okc);color:var(--ok)}
</style>
</head>
<body>
<div class="wb">
  <aside class="wb-nav" id="nav"></aside>
  <main class="wb-stage" id="stage"><div class="wb-cap" id="cap"></div></main>
  <aside class="wb-notes" id="notes"></aside>
</div>
<button class="wb-toggle" id="notesToggle">Design notes</button>
<script>

function batteryCells(items, rows) {
  return items.map(b => `<div class="bcell" aria-label="${esc(a11yBattery(b))}">
    <div class="bimg ${b.k}"><img src="${artFor(b.k)}" alt="" style="${b.last || b.lvl == null ? 'opacity:.55;filter:grayscale(.6)' : ''}"></div>
    ${rows ? `<div class="bmid"><span class="t-bl">${b.long || b.label}</span><span class="t-bs on3" style="display:flex;align-items:center;gap:6px">${glyph(b, 28)}${b.last ? 'Last seen ' + b.last : charging(b) ? 'Charging' : statusText(b)}</span></div>` : ''}
    <div class="bpct num${b.last || b.lvl == null ? ' muted' : isLow(b) ? ' low' : ''}">${pctText(b)}</div>
    ${rows ? '' : `<div class="blabel">${b.label}</div>`}
    ${rows ? '' : `<div class="bstat">${glyph(b)}${statusText(b) && !charging(b) ? `<span class="t-ls${isLow(b) ? ' low' : ''}">${statusText(b)}</span>` : ''}</div>`}
  </div>`).join('');
}

function heroCard() {
  const items = battery();
  const max = S.device === 'max';
  const connected = S.conn === 'connected';
  const model = max ? 'AirPods Max' : 'AirPods Pro 2 · USB-C';
  const name = max ? 'Qyuon’s AirPods Max' : S.name;
  const status = S.reconnecting ? `<span class="pill pulse"><i></i>Connecting…</span>` : connected ? `<span class="pill ok"><i></i>Connected</span>` : `<span class="pill"><i></i>Not connected</span>`;
  const rows = S.fs >= 1.6 || S.w < 330;
  let body;
  if (max) {
    const b = items[0];
    body = `<div class="max-hero batt" ${A('sheet', 'battery')} role="button" aria-label="${esc(a11yBattery(b))}. Battery details">
      <div class="max-photo"><img src="${IMG.max}" alt=""></div>
      <div style="display:flex;flex-direction:column;gap:4px"><div class="bpct num" style="font-size:calc(40px*var(--fs))">${pctText(b)}</div><div class="blabel">Headphones</div><div style="margin-top:4px">${glyph(b, 44)}</div></div></div>`;
  } else if (items.every(b => b.lvl == null)) {
    body = `<div class="batt" style="--cols:1;padding:22px 8px;text-align:center" role="status"><div class="t-bl">${S.refreshing ? 'Checking for battery updates…' : 'Battery levels unavailable'}</div><div class="t-bs on2" style="margin-top:6px">Open the case lid near your phone with an earbud inside.</div></div>`;
  } else {
    body = `<div class="batt${rows ? ' rows' : ''}${S.refreshing ? ' loading shimmer' : ''}" style="--cols:${items.length}" ${A('sheet', 'battery')} role="button" aria-label="Battery details">${batteryCells(items, rows)}</div>`;
  }
  const caseHint = connected && (S.scenario === 'stale') ? `<div class="banner" style="margin:6px 0 6px;padding:10px 12px;border-radius:14px"><span class="bi">${ic('info', 18)}</span><span class="t-bs">Open the lid near your phone with an earbud inside to update the case.</span></div>` : '';
  return `<section class="hero" aria-label="Device">
    <div class="hero-top">
      <div class="hero-id"><h1 class="t-tl">${esc(name)}</h1><div class="hero-meta"><span class="t-bm on2">${model}</span>${status}</div></div>
      ${connected ? `<button class="ibtn tonal rp" ${A('refresh')} aria-label="Refresh battery" ${S.refreshing ? 'disabled' : ''}>${ic('refresh', 22, S.refreshing ? 'spinning' : '')}</button>` : ''}
    </div>
    ${body}${caseHint}
    ${connected ? `<div class="hero-foot"><span class="t-ls on3" role="status">${S.refreshing ? 'Checking…' : S.updated}</span><button class="link rp" ${A('sheet', 'battery')}>Battery details ${ic('chevR', 18)}</button></div>` : ''}
  </section>`;
}

  const one = S.fs >= 1.8; // native: measure labels; one row, else 2 × 2, else a single column

  const idx = list.indexOf(S.mode);
  return `${section('Listening mode')}
  <div class="card" style="padding:8px 8px 6px">
    <div class="lm${grid ? ' grid' : ''}${one ? ' one' : ''}" style="--n:${list.length}" role="radiogroup" aria-label="Listening mode" id="lm">
      ${grid || one ? '' : `<span class="lm-ind noanim"></span>`}
      ${list.map(m => `<button class="${m === S.mode ? 'on' : ''}" ${A('mode', m)} role="radio" aria-checked="${m === S.mode}" aria-label="${MODES[m].label}">

    row({ icon: 'layers', t1: 'Switch listening mode', radio: S[key] === 'cycle', act: 'pick', arg: key + '|cycle' }),

}

function withState(over, fn) {
  const saved = {};
  for (const k of Object.keys(over)) saved[k] = S[k];
  Object.assign(S, over);
  try { return fn(); } finally { Object.assign(S, saved); }
}
function miniPhone(id, over = {}, mw = 180, theme, pal, scroll = 0) {
  const th = theme || (isDark() ? 'dark' : 'light'), pl = pal || palette();

    if (over.scenario) { const d = S.device, c = S.conn; applyScenario(over.scenario); const h = SCR[id].render(); S.device = d; S.conn = c; return h; }
    return SCR[id].render();
  });
  const inner = SCR[id].kind === 'home' ? html : `<div class="scr"><div style="margin-top:-${scroll}px">${withSpacer(html)}</div></div>`;
  return `<div class="mini-ph tk" data-theme="${th}" data-palette="${pl}" style="--mw:${mw}"><div class="inner" style="--fs:1;transform:scale(${mw / 384})">${statusBar()}<div class="host">${inner}</div></div></div>`;
}

const P = 'presentation/';
const NOTES = {
  splash: { sub: 'Android 12+ SplashScreen API, held until the profile and theme have loaded, so the app never flashes the wrong palette.', changes: ['Today: system default splash with an AppCompat theme. New: <code>Theme.SplashScreen</code> with the adaptive icon on <code>--bg</code>.'], compose: ['res/values/themes.xml', 'MainActivity.kt: installSplashScreen()'], a11y: ['No content. Exit animation honours “Remove animations”.'] },
  welcome: { sub: 'A single welcome replaces today’s two (account “Welcome to AnDPoP” and onboarding “Welcome to AnDPoP”).', changes: ['The account choice is no longer forced before onboarding. Guest is the default path, and “I already have an account” opens Log in.', 'The oversized display type and 52 dp carousel cards are replaced by a calm hero with the real product photos.', 'Three step dots: Welcome, Privacy, Permissions.'], interactions: ['Get started opens Privacy.', 'I already have an account opens Log in. Back returns here.'], compose: [P + 'screens/onboarding/OnboardingScreen.kt', 'account/AccountViewModel.kt (stop opening the account screen on first run)'], a11y: ['Photos are decorative (null contentDescription).', 'Title is a heading.'] },
  privacy: { sub: 'A short, accurate summary with a link to the hosted policy. Play requires the in-app policy to match the listing’s Data safety form.', changes: ['Adds the optional account (email sign-in, deletion), which the current text omits.', 'Removes “Links to LibrePods open in your browser”.', 'Strings move to resources so they can be translated (they are hard-coded today).'], compose: [P + 'screens/onboarding/PrivacyPolicyPage.kt'], a11y: ['The external link announces “opens in browser”.'] },
  permissions: { sub: 'Each permission gets its own Allow button and a one-line reason, which also serves as the prominent disclosure. The required one is marked.', changes: ['“Grant all”, which chained four prompts, is replaced by one button per permission. This matches Play’s guidance to request permissions in context.', 'Continue is enabled once Nearby devices is allowed. Optional permissions can wait.', 'Fixes the Phone and Overlay icons, which are announced as “bluetooth” today.'], interactions: ['Allow shows the system prompt (mocked here), then the row reads “Allowed”.', 'Display over other apps opens Android settings and is re-checked on resume.'], compose: [P + 'screens/onboarding/PermissionsPage.kt'], a11y: ['Each row merges into one TalkBack node: “Notifications, optional, Show battery and connection status, Allow, button”.'] },
  unsupported: { sub: 'Explains the Android requirement in plain terms and shows the phone’s own model and version.', changes: ['The full Device and App info cards move behind Troubleshooting.', '“Bypass compatibility check” is hidden unless developer options are on. Play builds never show it.'], compose: [P + 'screens/onboarding/NotSupportedPage.kt'] },
  dashboard: { sub: 'Keeps the v1.5 single-column order: battery, listening mode, Sound, AirPods controls, Press and hold, About. The device header and battery merge into one hero card.', changes: ['Header and battery panel become one hero card: name, model, status pill, refresh, three photo cells, “Updated just now” and Battery details.', 'The glass gradient and border on every panel are replaced by tonal surfaces. Groups use the connected-list style that Android 16 Settings uses.', 'Section headings drop from bold headline size to sentence-case label size, so the content leads.', 'The “Account” text button becomes an avatar (initials when signed in). Settings keeps the round sliders button.', 'Press and hold becomes two L/R tiles. “More device controls” is renamed “All device settings” and gains a subtitle.', 'Disconnected: Reconnect is the main action and the last-seen battery stays visible. Never paired: three pairing steps. Loading: skeleton.'], interactions: ['Tap the battery cells or Battery details to open the bottom sheet.', 'Refresh: the icon spins and values shimmer for about 3 s (the existing <code>REFRESH_WINDOW_MS</code>).', 'Listening mode: the indicator slides and the description updates. Device-reported changes animate the same way.', 'Use the Device state menu on the left to see charging, low, last-seen, estimated, missing, Max, disconnected, unpaired and loading.'], compose: [P + 'screens/AndpopDashboard.kt', P + 'screens/AndpopBattery.kt', P + 'screens/AndpopListeningModes.kt', P + 'screens/AndpopDeviceSettings.kt'], a11y: ['Each battery cell is one node: “Right bud, 48 percent, charging”.', 'Listening modes are a radio group with Selected state. The check mark gives a cue that does not rely on colour.', 'At font scale 1.3 or more, modes switch to 2 × 2. At 1.6, battery cells become rows and the L/R tiles stack.'] },
  rename: { sub: 'Single text field with a live counter, a clear button and an explicit Save.', changes: ['Replaces the StyledInputField that saved as you typed. Save is enabled only when the name changed and isn’t blank.'], compose: [P + 'screens/RenameScreen.kt'], a11y: ['Counter is exposed as the field’s supporting text.'] },
  microphone: { sub: 'Radio list with a short explanation for each option.', compose: [P + 'screens/MicrophoneSettingsScreen.kt'] },
  pressLeft: { sub: 'Choose the action first, then the modes it cycles through.', changes: ['The native rule “at least two modes” used to fail silently (<code>toggleListeningMode</code> ignores the tap). Now the last two checkboxes look locked; tapping one shakes it and highlights the helper text.', 'Notes that the cycle list is shared by both buds.'], compose: [P + 'screens/PressAndHoldSettingsScreen.kt', P + 'viewmodel/AirPodsViewModel.kt (toggleListeningMode)'] },
  accessibility: { sub: 'Speeds and durations use segmented buttons instead of radio lists, so each fits in one card.', changes: ['Press speed, hold duration and volume swipe speed each fit on one line.', 'Tone volume slider shows the value and speaker icons. The private-use SF Symbol glyphs are replaced.'], compose: [P + 'screens/AccessibilitySettingsScreen.kt'] },
  firmware: { sub: 'Read-only versions with copy-to-clipboard and a short note on how updates happen.', compose: [P + 'screens/VersionInfoScreen.kt'] },
  deviceSettings: { sub: 'Today’s “More device controls” screen, grouped by task. Controls already on the dashboard are no longer repeated here.', changes: ['Removes duplicates that also live on the dashboard: legacy battery view, Name, listening mode, press and hold, microphone, accessibility. Every destination stays reachable.', 'Removes the FOSS premium banner (hard-coded <code>#32829B</code>) and “Unlock advanced features”, because billing is always premium.', 'Disconnect asks for confirmation.', 'Hidden demo mode (5 taps) moves to developer options.'], compose: [P + 'screens/AirPodsSettingsScreen.kt', P + 'components/AudioSettings.kt', 'ConnectionSettings.kt', 'CallControlSettings.kt', 'AboutCard.kt'], a11y: ['The serial number row announces which component it shows.'] },
  equalizer: { sub: 'Recommended or Custom. Custom shows the curve and three band sliders (Low, Mid, High, matching <code>CustomEqBand</code>).', changes: ['The draggable canvas becomes a curve preview driven by sliders, which are easier to operate and work with TalkBack. Dragging the curve can remain as an extra.'], compose: [P + 'screens/EqualizerScreen.kt'] },
  adaptive: { sub: 'One slider snapping to 0, 50 and 100, with plain-language ends.', compose: [P + 'screens/AdaptiveStrengthScreen.kt'] },
  headGestures: { sub: 'Switch plus a test area with a clear result.', changes: ['The raw velocity plot moves behind developer options. Users see an animated head and a result.'], compose: [P + 'screens/HeadTrackingScreen.kt'] },
  hearingAid: { sub: 'Main switch, then Adjustments and Update hearing test result.', compose: [P + 'screens/HearingAidScreen.kt'] },
  hearingAdjust: { sub: 'Shared slider template, also used by Transparency mode.', compose: [P + 'screens/HearingAidAdjustmentsScreen.kt', P + 'screens/TransparencySettingsScreen.kt'], changes: ['Transparency’s raw 0–100 “Band n” sliders get the same styled slider.'] },
  transparency: { sub: 'Same slider template as hearing aid adjustments.', compose: [P + 'screens/TransparencySettingsScreen.kt'] },
  callMute: { sub: 'Mute and Hang up are linked: one is Press once and the other Press twice (the existing flipped byte pair).', compose: [P + 'screens/CallControlScreen.kt'] },
  settings: { sub: 'Same order as today, with clearer controls.', changes: ['Appearance: preview cards in place of the segmented row. Palette: colour swatches with localized names, which today are raw enum names.', 'Popups show an inline warning with Allow when the overlay permission is missing.', 'Automatic connection: the six status switches become two filter-chip groups.', 'Help and about adds Privacy policy and App version. Tapping App version 7 times shows Developer options.', 'Phone information collapses. A trademark notice sits at the bottom.', 'Credits stay in a dialog with OK, which keeps <code>AppearanceRegressionTest</code> passing.'], interactions: ['Try Light/Dark and the swatches. The whole prototype re-themes live.', 'Tap App version 7 times.'], compose: [P + 'screens/AppSettingsScreen.kt', P + 'theme/AndpopPalette.kt'] },
  troubleshooting: { sub: 'A three-step recorder replaces the five-step wizard and its hard-coded text.', changes: ['Xposed-specific steps appear only when Xposed is available.', 'Adds common fixes for problems users can solve themselves.'], compose: [P + 'screens/TroubleshootingScreen.kt'] },
  developer: { sub: 'Collects the tools that should not be visible to Play users.', changes: ['Account service (Supabase URL and key form), compatibility bypass, demo mode and “Act as an Apple device” move here from the account screen, onboarding and settings.'], compose: ['new DeveloperOptionsScreen.kt', 'BuildConfig.PLAY_BUILD gate'] },
  accountGuest: { sub: 'Account becomes a normal navigation destination with predictive back, so it no longer replaces the whole app.', changes: ['“Account service settings” is removed from this screen; it is now in developer options.', 'Remembered AirPods show as a row with Forget, which offers Undo.'], compose: ['account/AccountScreen.kt', 'MainActivity.kt (stop swapping NavigationRoot for AccountScreen)', P + 'navigation/AppNavGraph.kt (add Screen.Account)'] },

  login: { sub: 'Email and password with show/hide, inline validation and an error banner.', interactions: ['Type any valid email and password. Use wrong@example.com to see the error.'], compose: ['account/AccountScreen.kt'], a11y: ['Autofill hints: email and current password.', 'The error banner is announced (live region).'] },
  signup: { sub: 'Password rules show as a live checklist rather than appearing only after submit.', compose: ['account/AccountScreen.kt', 'account/AccountProtocol.kt (validNewPassword)'] },
  forgot: { sub: 'Request form, then a confirmation screen.', compose: ['account/AccountScreen.kt'] },
  credits: { sub: 'Credits dialog over Settings. Every attribution remains, and “Open-source licenses” opens the full list.', compose: [P + 'screens/AppSettingsScreen.kt'] },
  popup: { sub: 'Connection popup from the bottom, drawn over other apps.', changes: ['The <code>connected.mp4</code> video and plain text views are replaced by the same photo battery cells as the dashboard, and the popup follows the app palette.', 'Adds “Open AnDPoP”.'], compose: [P + 'overlays/PopupWindow.kt', 'res/layout/popup_window.xml, replaced by a ComposeView'] },
  island: { sub: 'Dynamic Island style popup at the top for connection and audio hand-off.', changes: ['Shows a battery ring and an Undo action when audio moves to another device.', 'Removes the user-visible “Connected to Linux” and “Moved to Linux” strings.'], compose: [P + 'overlays/IslandWindow.kt'] },
  shade: { sub: 'One informative notification replaces the two current ones.', changes: ['Rename the channel that shows the code text “AirPods BluetoothConnectionManager.aacpSocket? Connection Issues” in system settings to “Connection problems”.', 'The foreground-service notification is silent and minimized, and tapping it explains how to hide it.', 'The QS tile shows the mode name and device, and its icon matches the in-app glyph.'], interactions: ['Tap the listening-mode tile to cycle modes.'], compose: ['services/AirPodsService.kt', 'services/AirPodsQSService.kt'] },
  widgets: { sub: 'Widgets use the app palette and the same glyphs. Charging shows a bolt badge on the ring.', changes: ['Battery widget: rings for Left, Right, Case and, optionally, Phone. Listening-mode widget: a segmented row that matches the dashboard.', 'Recommended: move to Jetpack Glance for rounded, themed and resizable widgets.'], interactions: ['Tap a widget mode.'], compose: [P + 'widgets/BatteryWidget.kt', P + 'widgets/NoiseControlWidget.kt', 'res/layout/battery_widget.xml', 'listening_mode_widget.xml'] },

  boardStore: { sub: 'Icon, feature graphic, screenshots and listing copy.', changes: ['New icon. The current one (five mint bars) reads as an equalizer, not as earbuds.'] },

};

const PARENT = {
  privacy: ['welcome'], permissions: ['welcome', 'privacy'], unsupported: ['welcome', 'privacy'],
  troubleshooting: ['dashboard', 'settings'], developer: ['dashboard', 'settings'], licenses: ['dashboard', 'settings'],
  equalizer: ['dashboard', 'deviceSettings'], adaptive: ['dashboard', 'deviceSettings'], headGestures: ['dashboard', 'deviceSettings'],
  hearingAid: ['dashboard', 'deviceSettings'], hearingAdjust: ['dashboard', 'deviceSettings', 'hearingAid'], hearingProtection: ['dashboard', 'deviceSettings'],
  callMute: ['dashboard', 'deviceSettings'], callHang: ['dashboard', 'deviceSettings'], transparency: ['dashboard', 'accessibility'],
  login: ['dashboard', 'accountGuest'], signup: ['dashboard', 'accountGuest'], forgot: ['dashboard', 'accountGuest', 'login'],
};
const cur = () => S.stack[S.stack.length - 1].id;
const withSpacer = html => html.trimStart().startsWith('<header') ? html : `<div style="height:34px" aria-hidden="true"></div>${html}`;
const screenHTML = s => withSpacer(s.render());
let overlay = null;

function statusBar() {
  return `<div class="sb"><span class="num">14:42</span><span class="cam"></span><span class="sb-ic">${ic('bt', 15, '', 2)}<svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 11h2V8H1zM5 11h2V6H5zM9 11h2V3H9zM13 11h2V1h-2z" fill="currentColor"/></svg><svg width="24" height="12" viewBox="0 0 24 12"><rect x=".7" y=".7" width="20" height="10.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/><rect x="2.4" y="2.4" width="13" height="7.2" rx="1.6" fill="currentColor"/><rect x="21.8" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".6"/></svg></span></div>`;
}

function buildNav() {
  const groups = {};
  for (const [id, s] of Object.entries(SCR)) { if (s.hidden) continue; (groups[s.group] ||= []).push([id, s]); }
  const c = (key, opts, val, label = o => o) => `<div class="wb-ctl">${opts.map(o => `<button class="${val === o ? 'on' : ''}" data-wb="${key}" data-v="${o}">${label(o)}</button>`).join('')}</div>`;
  $('#nav').innerHTML = `<div class="wb-brand">${appIcon(34, 'squircle')}<div><b>AnDPoP 2.0 prototype</b><span>UI/UX redesign · Nov 2026</span></div></div>
    <div class="wb-h">Appearance</div>${c('appearance', ['system', 'light', 'dark'], S.appearance, o => o[0].toUpperCase() + o.slice(1))}
    ${S.appearance === 'system' ? c('sysDark', ['dark', 'light'], S.sysDark ? 'dark' : 'light', o => 'Phone is ' + o) : ''}
    <div class="wb-h">Palette (${isDark() ? 'dark' : 'light'})</div>${c('tint', Object.keys(TINTS), palette(), o => TINTS[o].name)}
    <div class="wb-h">Device state</div><select class="wb-sel" data-wb="scenario">${Object.entries(SCENARIOS).map(([k, v]) => `<option value="${k}" ${S.scenario === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <div class="wb-h">Screen width · font scale</div>${c('w', ['360', '384', '412'], String(S.w), o => o + ' dp')}${c('fs', ['1', '1.3', '1.6', '2'], String(S.fs), o => Math.round(o * 100) + '%')}
    <div class="wb-h">Profile</div>${c('profile', ['guest', 'user'], S.profile, o => o === 'guest' ? 'Guest' : 'Signed in')}
    ${Object.entries(groups).map(([g, l]) => `<div class="wb-h">${g}</div><div class="wb-list">${l.map(([id, s]) => `<a data-jump="${id}" class="${cur() === id || (overlay && overlay === s.overlay) ? 'on' : ''}">${s.name}${s.kind === 'home' ? '<small>system</small>' : s.kind === 'board' ? '<small>board</small>' : ''}</a>`).join('')}</div>`).join('')}
    <p class="wb-tip">Click through the phone like a real app. <kbd>Esc</kbd> or the gesture bar goes back. Screens and states are sample data; nothing connects to Bluetooth.</p>`;

function buildNotes() {
  const id = overlay && SCR.credits.overlay === overlay ? 'credits' : cur();
  const n = NOTES[id] || {}, s = SCR[id] || {};
  const li = a => a && a.length ? `<ul>${a.map(x => `<li>${x}</li>`).join('')}</ul>` : '';
  $('#notes').innerHTML = `<h2>${s.name || id}</h2><p class="sub">${n.sub || ''}</p>

    ${n.interactions ? `<h3>Try it</h3>${li(n.interactions)}` : ''}
    ${n.a11y ? `<h3>Accessibility</h3>${li(n.a11y)}` : ''}
    ${n.compose ? `<h3>Where it lands in Compose</h3>${li(n.compose.map(x => `<code>${x}</code>`))}` : ''}`;
}

function ensurePhone() {
  let ph = $('#phone');
  if (!ph) {
    $('#stage').insertAdjacentHTML('beforeend', `<div class="ph tk" id="phone"><div class="ph-in"><div class="host" id="host"></div>${statusBar()}<div class="layer" id="layer"></div><div class="snack" id="snack" role="status"><span></span></div><div class="gb" data-act="back" title="Back"><i></i></div></div></div><div id="boardHost" class="tk" style="display:none;width:100%"></div>`);
    ph = $('#phone');
  }
  return ph;
}

function render(opts = {}) {
  const id = cur(), s = SCR[id];
  const ph = ensurePhone();
  const th = isDark() ? 'dark' : 'light', pl = palette();
  for (const el of [ph, $('#boardHost')]) { el.dataset.theme = th; el.dataset.palette = pl; }
  ph.style.setProperty('--w', S.w); ph.style.setProperty('--h', S.h); ph.style.setProperty('--fs', S.fs); ph.classList.toggle('big', S.fs >= 1.6);
  const board = s.kind === 'board';
  $('#stage').classList.toggle('board-mode', board);
  document.body.classList.toggle('is-board', board);
  ph.style.display = board ? 'none' : '';
  $('#boardHost').style.display = board ? 'block' : 'none';
  $('#cap').textContent = board ? '' : `Galaxy S26 Ultra class · ${S.w} × ${S.h} dp · ${TINTS[pl].name} ${th} · font ${Math.round(S.fs * 100)}%`;
  if (board) {
    $('#boardHost').innerHTML = s.render();
    requestAnimationFrame(() => $$('[data-token]').forEach(el => { el.textContent = '--' + el.dataset.token + ' · ' + toHex(getComputedStyle(el).getPropertyValue('--' + el.dataset.token).trim()); }));
  } else {
    const host = $('#host');
    const old = $('.scr', host);
    const top = old ? old.scrollTop : 0;
    const focus = document.activeElement && document.activeElement.id && host.contains(document.activeElement) ? [document.activeElement.id, document.activeElement.selectionStart] : null;
    const anim = opts.keep ? '' : S.dir === 'push' ? 'enter-push' : S.dir === 'pop' ? 'enter-pop' : 'enter-fade';
    host.innerHTML = s.kind === 'home' ? s.render() : `<div class="scr ${anim}">${screenHTML(s)}</div>`;
    const scr = $('.scr', host);
    if (scr) {
      if (opts.keep) scr.scrollTop = top;
      const tb = $('.tb', scr);
      const onScroll = () => tb && !tb.classList.contains('always') && tb.classList.toggle('raised', scr.scrollTop > 24);
      scr.addEventListener('scroll', onScroll, { passive: true }); onScroll();
      if (tb && tb.classList.contains('always')) scr.addEventListener('scroll', () => tb.classList.toggle('raised', scr.scrollTop > 4), { passive: true });
    }
    if (focus) { const el = document.getElementById(focus[0]); if (el) { el.focus(); try { el.setSelectionRange(focus[1], focus[1]); } catch (e) { } } }
    renderLayer();
  }
  $$('.lm').forEach(placeInd);
  buildNav(); buildNotes();
  S.dir = 'fade';
}
function placeInd(lm) {
  const on = $('button.on', lm), ind = $('.lm-ind', lm);
  if (!on || !ind) return;
  ind.style.width = on.offsetWidth + 'px';
  ind.style.transform = `translateX(${on.offsetLeft - 4}px)`;
  if (ind.classList.contains('noanim')) requestAnimationFrame(() => requestAnimationFrame(() => ind.classList.remove('noanim')));
}
function toHex(c) {
  const m = c.match(/^#([0-9a-f]{6})/i); if (m) return '#' + m[1].toUpperCase();
  const r = c.match(/rgba?\(([^)]+)\)/); if (!r) return c;
  const [a, b, d, al] = r[1].split(',').map(x => parseFloat(x));
  const h = [a, b, d].map(x => Math.round(x).toString(16).padStart(2, '0')).join('').toUpperCase();
  return '#' + h + (al !== undefined && al < 1 ? ' · ' + Math.round(al * 100) + '%' : '');
}

function renderLayer() {
  const layer = $('#layer');
  if (!overlay) { layer.classList.remove('show'); layer.innerHTML = ''; return; }
  layer.innerHTML = `<div class="scrim" data-act="close"></div>${OVERLAYS[overlay]()}`;
  requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('show')));
}
function openOverlay(id) { overlay = id; renderLayer(); buildNav(); buildNotes(); }
function closeOverlay() {
  const layer = $('#layer'); layer.classList.remove('show'); const was = overlay; overlay = null;
  setTimeout(() => { if (!overlay) layer.innerHTML = ''; }, 300); buildNav(); buildNotes(); return was;
}

let snackTimer;
function toast(msg, action, fn) {
  const sn = $('#snack');
  sn.innerHTML = `<span>${msg}</span>${action ? `<button id="snackAct">${action}</button>` : ''}`;
  sn.classList.add('show');
  if (action) $('#snackAct').onclick = () => { sn.classList.remove('show'); fn(); };
  clearTimeout(snackTimer); snackTimer = setTimeout(() => sn.classList.remove('show'), 3200);
}

function push(id) { S.stack.push({ id }); S.dir = 'push'; render(); }
function back() {
  if (overlay) { closeOverlay(); return; }
  if (S.stack.length > 1) { S.stack.pop(); S.dir = 'pop'; render(); }
}
function jump(id) {
  const s = SCR[id];
  overlay = null;
  if (s.overlayOf) { S.stack = [{ id: 'dashboard' }, { id: s.overlayOf }]; render(); openOverlay(s.overlay); return; }
  if (s.kind === 'board' || s.kind === 'home' || s.root) S.stack = [{ id }];
  else S.stack = [...(PARENT[id] || ['dashboard']).map(x => ({ id: x })), { id }];
  S.renameDraft = null; S.headTest = 'idle'; S.forgotSent = false;
  render();
}

const RERENDER = new Set(['hearingAid', 'headGest', 'offMode', 'popSheet', 'popIsland']);
const act = {
  nav: id => { if (id === 'rename') S.renameDraft = null; if (id === 'forgot') S.forgotSent = false; push(id); },
  back, close: () => closeOverlay(), jump,
  toggle: (key, el) => {
    S[key] = !S[key];
    const sw = $('.sw', el); if (sw) sw.classList.toggle('on', S[key]); el.setAttribute('aria-checked', S[key]);
    if (key === 'offMode' && !S.offMode && S.mode === 'off') S.mode = 'anc';
    if (RERENDER.has(key)) setTimeout(() => render({ keep: true }), 260);
  },
  mode: (m) => {
    if (m === S.mode) return;
    S.mode = m;
    const lm = $('#lm'); if (!lm) return render({ keep: true });
    $$('button', lm).forEach(b => { const on = b.dataset.arg === m; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    placeInd(lm);
    const d = $('#lmDesc'); d.style.opacity = 0; setTimeout(() => { d.textContent = MODES[m].desc; d.style.opacity = 1; }, 150);
  },
  sheet: id => openOverlay(id),
  dialog: id => openOverlay(id),
  refresh: () => {
    if (S.refreshing) return; S.refreshing = true; render({ keep: true });
    setTimeout(() => { S.refreshing = false; S.updated = 'Updated just now'; render({ keep: true }); }, 2400);
  },
  pick: (arg) => {
    const [k, v] = arg.split('|'); S[k] = v;
    if (k === 'muteAction') S.hangAction = v === 'Press once' ? 'Press twice' : 'Press once';
    if (k === 'hangAction') S.muteAction = v === 'Press once' ? 'Press twice' : 'Press once';
    render({ keep: true });
  },
  cycle: (m, el) => {
    const list = ['off', 'transparency', 'adaptive', 'anc'].filter(x => x !== 'off' || S.offMode);
    const count = list.filter(x => S.cycle[x]).length;
    if (S.cycle[m] && count <= 2) {
      const c = $('.chk', el); c.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 260, iterations: 2 });
      const h = $('#cycleHelp'); h.style.color = 'var(--err)'; setTimeout(() => h.style.color = '', 1400);
      return;
    }
    S.cycle[m] = !S.cycle[m]; render({ keep: true });
  },
  appearance: k => { S.appearance = k; render({ keep: true }); },
  tint: k => { S.tint[isDark() ? 'dark' : 'light'] = k; render({ keep: true }); },
  chip: (arg, el) => { const [o, k] = arg.split('|'); S[o][k] = !S[o][k]; el.classList.toggle('on', S[o][k]); el.setAttribute('aria-checked', S[o][k]); },
  perm: k => {
    if (k === 'overlay') { toast('Opens “Display over other apps” in Android settings'); setTimeout(() => { S.perms.overlay = true; render({ keep: true }); }, 1100); return; }
    S.permAsk = k; openOverlay('sysperm');
  },
  permAllow: k => { S.perms[k] = true; closeOverlay(); setTimeout(() => render({ keep: true }), 120); },
  permDeny: k => { closeOverlay(); toast('You can allow this later in Android settings'); },
  finishOnboarding: () => { S.stack = [{ id: 'dashboard' }]; S.dir = 'fade'; render(); setTimeout(() => toast('You’re all set'), 300); },
  reconnect: () => {
    S.reconnecting = true; render({ keep: true });
    setTimeout(() => { S.reconnecting = false; applyScenario('normal'); render({ keep: true }); toast('Connected to ' + S.name); }, 1900);
  },
  saveName: () => { S.name = (S.renameDraft ?? S.name).trim(); S.renameDraft = null; back(); setTimeout(() => toast('Name updated'), 200); },
  clearName: () => { S.renameDraft = ''; render({ keep: true }); setTimeout(() => $('#nm') && $('#nm').focus(), 0); },
  resetName: () => { S.renameDraft = 'AirPods Pro'; render({ keep: true }); },
  copy: v => toast('Copied ' + v),
  serial: () => { S.serial++; render({ keep: true }); },
  eqReset: () => { S.eq = { low: 0, mid: 0, high: 0 }; render({ keep: true }); },
  headTest: () => {
    S.headTest = 'listen'; render({ keep: true });
    setTimeout(() => { S.headTest = Math.random() > .5 ? 'nod' : 'shake'; render({ keep: true }); }, 1700);
  },
  logStart: () => { S.logState = 'recording'; render({ keep: true }); },
  logStop: () => { S.logState = 'idle'; S.logs.unshift({ name: 'andpop-log-2026-11-24-1442.txt', size: '286 KB' }); render({ keep: true }); toast('Log saved'); },
  logDel: i => { const [l] = S.logs.splice(Number(i), 1); render({ keep: true }); toast('Log deleted', 'Undo', () => { S.logs.splice(Number(i), 0, l); render({ keep: true }); }); },
  logsClear: () => openOverlay('logsClear'),
  logsClearConfirm: () => { S.logs = []; closeOverlay(); render({ keep: true }); },
  devTap: () => {
    if (S.dev) { toast('Developer options are already on'); return; }
    S.devTaps++;
    if (S.devTaps >= 7) { S.dev = true; S.devTaps = 0; render({ keep: true }); toast('Developer options are on'); }
    else if (S.devTaps >= 3) toast(`${7 - S.devTaps} more taps to show developer options`);
  },
  devOff: () => { S.dev = false; back(); },
  phoneInfo: () => { S.phoneInfoOpen = !S.phoneInfoOpen; render({ keep: true }); },
  grantOverlay: () => { toast('Opens “Display over other apps” in Android settings'); setTimeout(() => { S.perms.overlay = true; render({ keep: true }); }, 900); },
  forget: () => { S.remembered = false; render({ keep: true }); toast('AirPods forgotten', 'Undo', () => { S.remembered = true; render({ keep: true }); }); },
  signout: () => { S.profile = 'guest'; S.stack = [{ id: 'dashboard' }, { id: 'accountGuest' }]; render(); toast('Signed out. You’re using the guest profile.'); },
  doLogin: () => {
    S.login.busy = true; S.login.err = ''; render({ keep: true });
    setTimeout(() => {
      S.login.busy = false;
      if (S.login.email.toLowerCase() === 'wrong@example.com') { S.login.err = 'Email or password is incorrect.'; render({ keep: true }); return; }
      S.profile = 'user'; S.email = S.login.email; S.stack = [{ id: 'dashboard' }]; render(); toast('Welcome back');
    }, 1100);
  },
  doSignup: () => { S.stack = [{ id: 'dashboard' }, { id: 'accountGuest' }]; render(); toast('Check your email for a confirmation link'); },
  guest: () => { S.profile = 'guest'; S.stack = [{ id: 'dashboard' }]; render(); toast('Using the guest profile'); },
  showPw: () => { S.login.show = !S.login.show; render({ keep: true }); },
  sendReset: () => { S.forgotSent = true; render({ keep: true }); },
  toast: m => toast(m),
  deleteConfirm: () => { closeOverlay(); S.profile = 'guest'; S.stack = [{ id: 'dashboard' }]; render(); toast('Account deleted'); },
  disconnectConfirm: () => { closeOverlay(); applyScenario('disconnected'); S.stack = [{ id: 'dashboard' }]; render(); toast('AirPods disconnected'); },
  navFromDialog: id => { closeOverlay(); setTimeout(() => push(id), 200); },
  qsCycle: () => { const l = modeList(); S.mode = l[(l.indexOf(S.mode) + 1) % l.length]; render({ keep: true }); },
  islandTap: () => { S.islandMoved = !S.islandMoved; render({ keep: true }); },
  widgetMode: m => { S.mode = m; render({ keep: true }); },
  popupReplay: () => { const p = $('#popup'); p.style.animation = 'none'; p.style.transform = 'translateY(120%)'; p.style.transition = 'transform .3s'; setTimeout(() => render({ keep: true }), 900); },
};

/* ── Events ── */
document.addEventListener('click', e => {
  const wb = e.target.closest('[data-wb]');
  if (wb && wb.tagName === 'BUTTON') {
    const k = wb.dataset.wb, v = wb.dataset.v;
    if (k === 'appearance') S.appearance = v;
    else if (k === 'sysDark') S.sysDark = v === 'dark';
    else if (k === 'tint') S.tint[isDark() ? 'dark' : 'light'] = v;
    else if (k === 'w') S.w = Number(v);
    else if (k === 'fs') S.fs = Number(v);
    else if (k === 'profile') { S.profile = v; if (cur().startsWith('account')) S.stack[S.stack.length - 1].id = v === 'user' ? 'accountUser' : 'accountGuest'; }
    render({ keep: true }); return;
  }
  const j = e.target.closest('[data-jump]'); if (j) { jump(j.dataset.jump); return; }
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled && act[a.dataset.act]) { e.preventDefault(); act[a.dataset.act](a.dataset.arg, a, e); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.wb === 'scenario') { applyScenario(e.target.value); if (!['dashboard', 'popup', 'island', 'shade', 'widgets', 'boardStore'].includes(cur())) jump('dashboard'); else render({ keep: true }); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input) {
    const k = t.dataset.input, v = Number(t.value); S[k] = v;
    const min = Number(t.min), max = Number(t.max); t.style.setProperty('--p', ((v - min) / (max - min)) * 100 + '%');
    const lab = $('#sv-' + k);
    if (lab) lab.textContent = t.dataset.fmt === 'pct' ? v + '%' : t.dataset.fmt === 'signed' ? signed(v) : k === 'balance' ? (v === 0 ? 'Centered' : v < 0 ? 'L ' + -v : 'R ' + v) : v;
    if (k.startsWith('eq_')) { const e2 = S.eq, y = q => 75 - q * 6; const d = `M0 ${y(e2.low)} C 50 ${y(e2.low)}, 80 ${y(e2.mid)}, 150 ${y(e2.mid)} S 250 ${y(e2.high)}, 300 ${y(e2.high)}`; $('#eqPath').setAttribute('d', d); $('#eqFill').setAttribute('d', d + ' L300 150 L0 150 Z'); }
    return;
  }
  if (t.dataset.text) {
    const path = t.dataset.text.split('.');
    if (path.length === 1) S[path[0]] = t.value; else { S[path[0]][path[1]] = t.value; if (path[0] === 'login') S.login.touched = false; }
    render({ keep: true });
  }
});
document.addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.text === 'login.email') { S.login.touched = true; setTimeout(() => { if (!document.activeElement || document.activeElement.tagName !== 'INPUT') render({ keep: true }); }, 0); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') back();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act][tabindex="0"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.rp'); if (!el) return;
  const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2;
  const s = document.createElement('span'); s.className = 'ripple';
  s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  el.appendChild(s); setTimeout(() => s.remove(), 600);
});
$('#notesToggle').addEventListener('click', () => $('#notes').classList.toggle('open'));

/* ── Screenshot hook used to export the PNGs in docs/v2-ui/screens ── */
window.__shot = (cfg = {}) => {
  document.body.classList.add('shot');
  overlay = null;
  if (cfg.appearance) S.appearance = cfg.appearance;
  if (cfg.palette) S.tint[isDark() ? 'dark' : 'light'] = cfg.palette;
  if (cfg.scenario) applyScenario(cfg.scenario);
  for (const k of ['mode', 'profile', 'fs', 'w', 'dev', 'logState', 'headTest', 'eqMode']) if (cfg[k] !== undefined) S[k] = cfg[k];
  if (cfg.perms) Object.assign(S.perms, cfg.perms);
  if (cfg.eq) S.eq = cfg.eq;
  jump(cfg.screen || 'dashboard');
  $('#phone').classList.toggle('tall', !!cfg.tall);
  if (cfg.overlay) { openOverlay(cfg.overlay); }
  if (cfg.scrollTo) { const sc = $('.scr'); if (sc) sc.scrollTop = cfg.scrollTo; }
  return true;
};

/* ── Init ── */
S.stack = [{ id: 'dashboard' }];
render();
